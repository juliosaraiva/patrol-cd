---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusters.cd.patrol.example
spec:
  group: cd.patrol.example
  names:
    categories:
    - patrol
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - pcluster
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Display Name
      type: string
    - jsonPath: .spec.server
      name: Server
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .status.connectionState.status
      name: Connection
      type: string
    - jsonPath: .status.assignedShard
      name: Shard
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster registers a destination cluster. It replaces Argo CD's Secrets labeled
          argocd.argoproj.io/secret-type=cluster. Labels and annotations of the cluster (used by cluster
          generators and sharding) are the Cluster object's metadata. Credentials are never stored in the
          object: spec.config.credentialsRef names a Secret whose keys are the ClusterSecretKey* constants.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the cluster configuration.
            properties:
              clusterResources:
                description: ClusterResources allows cluster-scoped resources when
                  Namespaces is set.
                type: boolean
              config:
                description: Config holds connection settings.
                properties:
                  awsAuthConfig:
                    description: AWSAuthConfig authenticates with AWS IAM (EKS).
                    properties:
                      clusterName:
                        description: ClusterName is the EKS cluster name.
                        type: string
                      profile:
                        description: Profile is the AWS profile to use.
                        type: string
                      roleARN:
                        description: RoleARN is an IAM role to assume.
                        type: string
                    type: object
                  credentialsRef:
                    description: |-
                      CredentialsRef names a Secret in the same namespace holding credentials and CA data. Recognized
                      keys: bearerToken, username, password, caData, certData, keyData.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  disableCompression:
                    description: DisableCompression disables response compression.
                    type: boolean
                  execProviderConfig:
                    description: |-
                      ExecProviderConfig authenticates with an exec credential plugin. Do not put credentials in its
                      args or env; use CredentialsRef.
                    properties:
                      apiVersion:
                        description: APIVersion is the preferred ExecCredential version.
                        type: string
                      args:
                        description: Args passed to the command.
                        items:
                          type: string
                        type: array
                      command:
                        description: Command to execute.
                        type: string
                      config:
                        description: Config is passed to the plugin as ExecCredential.spec.cluster.config.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      env:
                        additionalProperties:
                          type: string
                        description: Env are additional environment variables for
                          the command.
                        type: object
                      installHint:
                        description: InstallHint is shown when the command is not
                          found.
                        type: string
                      provideClusterInfo:
                        description: ProvideClusterInfo passes cluster information
                          in KUBERNETES_EXEC_INFO.
                        type: boolean
                    type: object
                  proxyURL:
                    description: ProxyURL is the proxy used for all requests to the
                      cluster.
                    type: string
                  tlsClientConfig:
                    description: TLSClientConfig holds TLS settings.
                    properties:
                      insecure:
                        description: Insecure skips server certificate verification.
                          For testing only.
                        type: boolean
                      serverName:
                        description: ServerName is used for SNI and certificate verification
                          instead of the server host name.
                        type: string
                    type: object
                type: object
              name:
                description: Name of the cluster, referenced by Application destinations
                  (spec.destination.name).
                maxLength: 253
                minLength: 1
                type: string
              namespaces:
                description: |-
                  Namespaces restricts management to these namespaces. When set, cluster-scoped resources are
                  ignored unless ClusterResources is true.
                items:
                  type: string
                type: array
              project:
                description: Project scopes the cluster to an AppProject.
                type: string
              server:
                description: |-
                  Server is the URL of the cluster's API server. It cannot change: the status describes this
                  destination, so another one needs a new Cluster.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: server must be an http(s) URL
                  rule: isURL(self) && url(self).getScheme() in ['https', 'http']
                    && url(self).getHostname() != ''
                - message: server is immutable
                  rule: self == oldSelf
              shard:
                description: Shard pins the cluster to a controller shard. Computed
                  by the sharding algorithm when unset.
                format: int64
                minimum: 0
                type: integer
            required:
            - name
            - server
            type: object
          status:
            description: Status is the observed state of the cluster.
            properties:
              assignedShard:
                description: AssignedShard is the controller shard managing the cluster.
                format: int64
                type: integer
              conditions:
                description: Conditions are the current conditions (Ready, ConnectionFailed).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionState:
                description: ConnectionState is the result of the last connection
                  check.
                properties:
                  attemptedAt:
                    description: |-
                      AttemptedAt is when the connection status was determined. On a Cluster object it moves only
                      when the status or message changes, so it says since when that state holds.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable description of the connection
                      status.
                    type: string
                  status:
                    description: Status of the last connection attempt.
                    enum:
                    - Successful
                    - Failed
                    - Unknown
                    type: string
                required:
                - status
                type: object
              info:
                description: Info holds cache and usage information.
                properties:
                  apiVersions:
                    description: APIVersions are the API versions served by the cluster.
                    items:
                      type: string
                    type: array
                  applicationsCount:
                    description: ApplicationsCount is the number of Applications targeting
                      the cluster.
                    format: int64
                    type: integer
                  cacheInfo:
                    description: CacheInfo describes the controller's live-state cache
                      of the cluster.
                    properties:
                      apisCount:
                        description: APIsCount is the number of watched APIs.
                        format: int64
                        type: integer
                      lastCacheSyncTime:
                        description: LastCacheSyncTime is when the cache was last
                          fully synchronized.
                        format: date-time
                        type: string
                      resourcesCount:
                        description: ResourcesCount is the number of cached resources.
                        format: int64
                        type: integer
                    type: object
                type: object
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
              serverVersion:
                description: ServerVersion is the Kubernetes version of the cluster.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
