# Hand-written, not generated by controller-gen: install it together with the CRDs
# (kubectl apply --server-side -f deploy/crds). Requires Kubernetes >= 1.30.
#
# CRD validation rules cannot see who sends a request or an object's labels, so this policy guards
# the Operation fields that depend on them (Go constants: v1alpha1.OperationAdmissionPolicyName,
# v1alpha1.OperationInitiatorVerb, v1alpha1.LabelKeyOperationApplication):
#   - On create, spec.initiatedBy.username must be empty or equal the requesting user, and
#     spec.initiatedBy.automated must be false, unless the requester may "impersonate" operations
#     (grant that verb only to patrol-server, which sets the user from verified token claims, and to
#     the application controller, which creates automated syncs).
#   - The cd.patrol.example/application label, when present, must equal spec.application.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: operations.cd.patrol.example
  labels:
    app.kubernetes.io/part-of: patrol-cd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cd.patrol.example"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["operations"]
  variables:
    - name: username
      expression: >-
        has(object.spec.initiatedBy) && has(object.spec.initiatedBy.username) ?
        object.spec.initiatedBy.username : ''
    - name: automated
      expression: >-
        has(object.spec.initiatedBy) && has(object.spec.initiatedBy.automated) &&
        object.spec.initiatedBy.automated
  validations:
    - expression: >-
        request.operation != 'CREATE' ||
        ((variables.username == '' || variables.username == request.userInfo.username) && !variables.automated) ||
        authorizer.group('cd.patrol.example').resource('operations').namespace(request.namespace).check('impersonate').allowed()
      reason: Forbidden
      message: >-
        spec.initiatedBy.username must be empty or the requesting user and spec.initiatedBy.automated
        must be false; creating Operations on behalf of others requires the impersonate verb on
        operations.cd.patrol.example
    - expression: >-
        !has(object.metadata.labels) || !('cd.patrol.example/application' in object.metadata.labels) ||
        object.metadata.labels['cd.patrol.example/application'] == object.spec.application
      reason: Invalid
      message: label cd.patrol.example/application must equal spec.application
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: operations.cd.patrol.example
  labels:
    app.kubernetes.io/part-of: patrol-cd
spec:
  policyName: operations.cd.patrol.example
  validationActions: [Deny]
