---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: repositories.cd.patrol.example
spec:
  group: cd.patrol.example
  names:
    categories:
    - patrol
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
    - prepo
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.purpose
      name: Purpose
      type: string
    - jsonPath: .spec.project
      name: Project
      priority: 1
      type: string
    - jsonPath: .status.connectionState.status
      name: Connection
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Repository registers one git, Helm or OCI repository and how to access it. It replaces Argo CD's
          Secrets labeled argocd.argoproj.io/secret-type=repository (and repository-write). Credentials are
          never stored in the object: spec.credentialsRef names a Secret in the same namespace whose keys are
          the RepositorySecretKey* constants.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the repository configuration.
            properties:
              azureServicePrincipal:
                description: |-
                  AzureServicePrincipal authenticates with an Azure service principal; the client secret is read
                  from the credentials Secret (key azureServicePrincipalClientSecret).
                properties:
                  activeDirectoryEndpoint:
                    description: ActiveDirectoryEndpoint (default https://login.microsoftonline.com).
                    type: string
                  clientID:
                    description: ClientID of the service principal.
                    type: string
                  tenantID:
                    description: TenantID of the service principal.
                    type: string
                required:
                - clientID
                - tenantID
                type: object
              credentialsRef:
                description: |-
                  CredentialsRef names a Secret in the same namespace holding credentials. Recognized keys:
                  username, password, bearerToken, sshPrivateKey, tlsClientCertData, tlsClientCertKey,
                  githubAppPrivateKey, gcpServiceAccountKey, azureServicePrincipalClientSecret.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              depth:
                description: Depth is the clone depth for shallow clones; 0 means
                  a full clone.
                format: int64
                minimum: 0
                type: integer
              enableLFS:
                description: EnableLFS fetches git-lfs objects (git only).
                type: boolean
              enableOCI:
                description: EnableOCI enables Helm OCI support for a Helm repository.
                type: boolean
              forceHTTPBasicAuth:
                description: ForceHTTPBasicAuth sends basic auth on the first request
                  instead of waiting for a challenge.
                type: boolean
              githubApp:
                description: |-
                  GitHubApp authenticates as a GitHub App installation; the private key is read from the
                  credentials Secret (key githubAppPrivateKey) unless SCMProviderRef supplies the App.
                properties:
                  appID:
                    description: AppID of the GitHub App.
                    format: int64
                    minimum: 1
                    type: integer
                  enterpriseBaseURL:
                    description: EnterpriseBaseURL is the GitHub Enterprise API URL
                      (default https://api.github.com).
                    type: string
                  installationID:
                    description: InstallationID of the App in the repository's organization.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - appID
                - installationID
                type: object
              insecure:
                description: Insecure skips TLS certificate and SSH host key verification.
                type: boolean
              insecureIgnoreHostKey:
                description: |-
                  InsecureIgnoreHostKey skips SSH host key verification (git only).

                  Deprecated: use Insecure.
                type: boolean
              insecureOCIForceHTTP:
                description: InsecureOCIForceHTTP connects to an OCI registry over
                  plain HTTP (OCI only).
                type: boolean
              name:
                description: Name is the Helm repository name used in dependency resolution
                  (Helm repositories only).
                type: string
              noProxy:
                description: NoProxy is a comma-separated list of hosts that bypass
                  Proxy.
                type: string
              project:
                description: |-
                  Project scopes the repository to an AppProject; it is then implicitly allowed in that project's
                  sourceRepos and usable only by its Applications.
                type: string
              proxy:
                description: Proxy is the HTTP(S) proxy URL used to reach the repository.
                type: string
              purpose:
                default: read
                description: Purpose of the credentials.
                enum:
                - read
                - write
                type: string
              scmProviderRef:
                description: |-
                  SCMProviderRef obtains credentials (e.g. GitHub App installation tokens) from an SCMProvider in
                  the same namespace.
                properties:
                  name:
                    description: Name of the SCMProvider.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                default: git
                description: Type of the repository.
                enum:
                - git
                - helm
                - oci
                type: string
              url:
                description: URL of the repository (https://, ssh://, git@host:path,
                  oci://, or a Helm repository URL).
                maxLength: 2048
                minLength: 1
                type: string
              useAzureWorkloadIdentity:
                description: UseAzureWorkloadIdentity authenticates with Azure Workload
                  Identity.
                type: boolean
            required:
            - url
            type: object
            x-kubernetes-validations:
            - message: purpose write is only supported for git repositories
              rule: '!has(self.purpose) || self.purpose != ''write'' || !has(self.type)
                || self.type == ''git'''
            - message: enableLFS is only supported for git repositories
              rule: '!has(self.enableLFS) || !self.enableLFS || !has(self.type) ||
                self.type == ''git'''
          status:
            description: Status is the observed state of the repository.
            properties:
              conditions:
                description: Conditions are the current conditions (Ready, ConnectionFailed).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionState:
                description: ConnectionState is the result of the last connection
                  check.
                properties:
                  attemptedAt:
                    description: AttemptedAt is when the connection status was determined.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable description of the connection
                      status.
                    type: string
                  status:
                    description: Status of the last connection attempt.
                    enum:
                    - Successful
                    - Failed
                    - Unknown
                    type: string
                required:
                - status
                type: object
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
