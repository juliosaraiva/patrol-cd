apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: applicationset-controller
    app.kubernetes.io/instance: patrol
    app.kubernetes.io/name: patrol-applicationset-controller
    app.kubernetes.io/part-of: patrol-cd
    app.kubernetes.io/version: 0.1.0
  name: patrol-applicationset-controller
  namespace: patrol
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/instance: patrol
      app.kubernetes.io/name: patrol-applicationset-controller
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/cmd-params: 549e5b0d6190978e4197de7dee8867ba8de3dadfbad30b2150a0fe221adfc149
      labels:
        app.kubernetes.io/component: applicationset-controller
        app.kubernetes.io/instance: patrol
        app.kubernetes.io/name: patrol-applicationset-controller
        app.kubernetes.io/part-of: patrol-cd
        app.kubernetes.io/version: 0.1.0
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: patrol
                  app.kubernetes.io/name: patrol-applicationset-controller
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: true
      containers:
      - args:
        - /usr/local/bin/patrolcd
        - appset-controller
        - --shutdown-timeout=30s
        - --metrics-addr=:8080
        - --healthz-addr=:8081
        - --enable-leader-election
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
        image: patrol-cd/patrol-cd:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: probes
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        name: applicationset-controller
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: probes
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: probes
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/config/internal-token
          name: internal-token
          readOnly: true
        - mountPath: /home/patrol/params
          name: params
          readOnly: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: patrol-applicationset-controller
      terminationGracePeriodSeconds: 45
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: tmp
      - name: internal-token
        secret:
          defaultMode: 288
          items:
          - key: token
            path: token
          secretName: patrol-internal-token
      - configMap:
          items:
          - key: applicationsetcontroller.profile.enabled
            path: profiler.enabled
          name: patrol-cmd-params-cm
          optional: true
        name: params
