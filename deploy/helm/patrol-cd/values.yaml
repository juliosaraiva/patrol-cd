dex:
  # -- Deploy Dex (upstream image) for SSO. patrol-server proxies /api/dex to it. Also set
  # configs.cm."url" and configs.cm."dex.config" (the connectors), see
  # docs/guides/installation.md: the Dex launcher of Argo CD (gendexcfg) is not part of Patrol,
  # so the client secret of the "patrol" static client is supplied through clientSecretRef.
  enabled: false
  image:
    # -- Dex image registry (replaced by global.imageRegistry when set).
    registry: ghcr.io
    # -- Dex image repository.
    repository: dexidp/dex
    # -- Dex image tag (the Argo CD v3.5.5 baseline's Dex version).
    tag: v2.45.1
    # -- Dex image digest (multi-arch index of v2.45.1).
    digest: sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    # -- Pull policy.
    pullPolicy: IfNotPresent
  # -- Dex configuration merged over the chart's (issuer, storage, web, grpc, telemetry and the
  # patrol/patrol-cli static clients), typically connectors. Rendered into a Secret; use
  # $ENV_VAR references with env/envFrom for credentials.
  config: {}
  # -- Existing Secret holding the complete Dex configuration (key config.yaml) instead of the
  # rendered one.
  existingConfigSecret: ""
  clientSecretRef:
    # -- Secret holding the client secret of the "patrol" static client (env
    # PATROL_DEX_CLIENT_SECRET, referenced as secretEnv). Required unless existingConfigSecret.
    name: ""
    # -- Key of that Secret.
    key: clientSecret
  # -- Extra environment variables (e.g. connector secrets from secretKeyRef).
  env: []
  # -- Extra envFrom sources.
  envFrom: []
  # -- Resources.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Pod annotations.
  podAnnotations: {}
  # -- Pod labels.
  podLabels: {}
  # -- Pod security context (the Dex image runs as UID 1001).
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  # -- Container security context.
  containerSecurityContext: {}
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}
  # -- Priority class.
  priorityClassName: ""
  # -- Termination grace period, seconds.
  terminationGracePeriodSeconds: 30
  pdb:
    # -- Create a PodDisruptionBudget.
    enabled: true
    # -- maxUnavailable (when minAvailable is empty). 0 blocks every voluntary eviction: node
    # drains wait until it is changed.
    maxUnavailable: 1
  serviceAccount:
    # -- Create the ServiceAccount (no RBAC with the default memory storage).
    create: true
    # -- Name (default <prefix>-dex-server). Required when create is false: the chart then uses this
    # existing ServiceAccount and never falls back to the namespace's default one.
    name: ""
    # -- Annotations.
    annotations: {}

rbac:
  # -- Create Roles, ClusterRoles and their bindings.
  create: true
  # -- "cluster": the controller manages the local cluster through a ClusterRole and the server
  # reads live resources cluster-wide. "namespaced": namespace-install semantics, Roles only;
  # on the local cluster the controller manages only the release namespace and
  # rbac.managedNamespaces, and applicationNamespaces must be empty.
  scope: cluster
  # -- namespaced scope: extra namespaces the controller (and server) may manage on the local
  # cluster (Roles are created there).
  managedNamespaces: []
  controller:
    # -- cluster scope: grant the controller cluster-admin-equivalent rights on the local cluster
    # (all resources, all verbs), as Argo CD does. Anyone who can create Applications in a
    # project allowing the in-cluster destination can then deploy anything to this cluster.
    clusterAdmin: true
    # -- cluster scope with clusterAdmin false: ClusterRole rules for the local cluster. The
    # default reads everything (the live-state cache needs list/watch); add write rules for the
    # kinds Applications deploy.
    rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["*"]
        verbs: ["get"]
  server:
    # -- cluster scope: ClusterRole for live resources of the local (in-cluster) destination:
    # get/patch/delete any resource, list events, read pods and logs, create Jobs (resource
    # actions). patrol-server reaches the in-cluster destination with its own identity.
    localCluster: true
    # -- Grant pods/exec create (web terminal). Also needs configs.cm."exec.enabled": "true".
    exec: false
    # -- Grant impersonate on ServiceAccounts (application.sync.impersonation.enabled).
    impersonation: false
    # -- Extra ClusterRole rules of the server (e.g. create on kinds created by resource actions).
    extraClusterRules: []
  # -- Extra Role rules of the ApplicationSet controller in the release namespace (e.g. get on
  # the duck-typed resources of the cluster decision resource generator).
  appsetControllerExtraRules: []

networkPolicy:
  # -- Create NetworkPolicies: each component accepts only its documented callers and reaches
  # only its documented destinations (ingress and egress are both restricted).
  enabled: true
  dns:
    # -- Destinations of DNS egress (default: kube-dns pods in kube-system).
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # -- DNS ports.
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
  kubeAPIServer:
    # -- CIDRs of the Kubernetes API server (narrow to the endpoint IPs of the kubernetes
    # Service). Used by server, controller, appset and notifications controllers.
    cidrs:
      - 0.0.0.0/0
      - ::/0
    # -- Ports of the Kubernetes API server.
    ports:
      - 443
      - 6443
  # -- Peers allowed to scrape metrics ports (NetworkPolicyPeer list); [] blocks scraping.
  metricsFrom:
    - namespaceSelector: {}
  # -- Peers allowed to reach patrol-server's API port; [] allows everyone (ingress controllers,
  # webhooks, CLI).
  serverFrom: []
  # -- CIDRs removed from the external egress of the repo-server and the commit-server
  # (repoServerEgress, commitServerEgress), which fetch tenant-supplied URLs: the cloud instance
  # metadata endpoints (169.254.169.254 on AWS, GCP and Azure; fd00:ec2::254 on AWS IPv6).
  # Merged into their except lists. Set [] when these components must reach a metadata server
  # (for example for workload identity credentials).
  excludeMetadataEndpoints:
    - 169.254.169.254/32
    - fd00:ec2::254/128
  # -- External egress of patrol-server: OIDC providers, remote destination clusters, proxy
  # extension backends. In every *Egress value, an except entry is removed from each listed
  # CIDR that strictly contains it and is ignored elsewhere, so a narrower CIDR listed next to
  # 0.0.0.0/0 adds a range back (cidrs [0.0.0.0/0, 10.20.0.0/16], except [10.0.0.0/8]).
  serverEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 443
      - 6443
  # -- Egress of the controller to destination clusters (remote API servers).
  controllerEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 443
      - 6443
  # -- Egress of the repo-server to Git, Helm and OCI hosts (narrow cidrs/ports to tighten);
  # excludeMetadataEndpoints is added to except.
  repoServerEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 22
      - 80
      - 443
  # -- Egress of the ApplicationSet controller to SCM provider APIs.
  appsetControllerEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 443
  # -- Peers allowed to reach the ApplicationSet webhook port; [] allows everyone.
  appsetWebhookFrom: []
  # -- Egress of the notifications controller to notification services.
  notificationsEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 80
      - 443
      - 465
      - 587
  # -- Egress of the commit-server to Git hosts; excludeMetadataEndpoints is added to except.
  commitServerEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 22
      - 80
      - 443
  # -- Egress of Dex to identity providers.
  dexEgress:
    cidrs:
      - 0.0.0.0/0
      - ::/0
    except: []
    ports:
      - 443
      - 636
  # -- Extra egress rules (NetworkPolicyEgressRule list) per component key: server, controller,
  # repoServer, appsetController, notificationsController, commitServer, dex.
  extraEgress: {}

metrics:
  serviceMonitor:
    # -- Create ServiceMonitors (needs monitoring.coreos.com/v1).
    enabled: false
    # -- Namespace of the ServiceMonitors (default: the release namespace).
    namespace: ""
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Labels (e.g. the Prometheus selector).
    labels: {}
    # -- Annotations.
    annotations: {}
    # -- Relabelings.
    relabelings: []
    # -- Metric relabelings.
    metricRelabelings: []
  prometheusRule:
    # -- Create a PrometheusRule with Patrol alerts (needs monitoring.coreos.com/v1).
    enabled: false
    # -- Namespace of the PrometheusRule (default: the release namespace).
    namespace: ""
    # -- Labels (e.g. the Prometheus rule selector).
    labels: {}
    # -- Annotations.
    annotations: {}
    # -- Labels added to every alert.
    alertLabels:
      severity: warning
    # -- Repo-server error ratio (internal, unavailable, deadline_exceeded,
    # resource_exhausted) above which PatrolRepoServerErrors fires.
    repoServerErrorRatio: 0.1
    # -- Comparison failures per 15 minutes above which PatrolComparisonFailures fires.
    comparisonFailuresPer15m: 10
    # -- Extra rules appended to the group.
    additionalRules: []

tracing:
  # -- OpenTelemetry collector address (host:port, OTLP/gRPC) for server, controller and
  # repo-server (otlp.address).
  otlpAddress: ""
  # -- Connect to the collector without TLS (otlp.insecure).
  insecure: true
  # -- Resource attributes (key:value) (otlp.attrs).
  attrs: []
  headersSecret:
    # -- Secret holding OTLP headers (k1=v1,k2=v2), e.g. authentication; passed as environment
    # variables, never written to the ConfigMap.
    name: ""
    # -- Key of that Secret.
    key: headers
  networkPolicy:
    # -- Destinations (NetworkPolicyPeer list) of the egress rule to the collector that the
    # server, controller and repo-server NetworkPolicies get when an OTLP address is set
    # (otlpAddress, or otlp.address in configs.params); [] allows the port to any destination.
    to: []
    # -- Collector port of that rule; 0 takes the port of the address (4317, the OTLP/gRPC
    # port, when it has none).
    port: 0

# -- Extra objects rendered with the release (tpl strings or maps).
extraObjects: []
