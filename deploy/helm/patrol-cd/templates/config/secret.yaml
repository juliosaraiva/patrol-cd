{{- if .Values.configs.secret.create }}
{{- $s := .Values.configs.secret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  {{- include "patrol.metadata" (list . "patrol-secret" "config" $s.labels $s.annotations) | nindent 2 }}
{{- /*
Only user-provided keys are rendered. server.secretkey and the generated admin password are
written at runtime by the bootstrap step and patrol-server; they are not part of this manifest,
so `helm upgrade` (three-way merge or server-side apply) leaves them in place.
*/}}
{{- $data := dict }}
{{- range $k, $v := $s.extra }}{{ $_ := set $data $k $v }}{{ end }}
{{- if $s.adminPasswordHash }}
{{- $_ := set $data "admin.password" $s.adminPasswordHash }}
{{- with $s.adminPasswordMtime }}{{ $_ := set $data "admin.passwordMtime" . }}{{ end }}
{{- end }}
{{- with $data }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
