{{- include "patrol.validate" . -}}
{{- if .Values.configs.create.params }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "patrol.metadata" (list . "patrol-cmd-params-cm" "config" dict dict) | nindent 2 }}
{{- with (include "patrol.paramsData" . | fromYaml) }}
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
