{{- if and .Values.notificationsController.enabled .Values.notificationsController.secret.create }}
{{- $s := .Values.notificationsController.secret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  {{- include "patrol.metadata" (list . "patrol-notifications-secret" "config" $s.labels $s.annotations) | nindent 2 }}
{{- with $s.items }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
