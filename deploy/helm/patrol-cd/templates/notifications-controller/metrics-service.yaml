{{- if .Values.notificationsController.enabled }}
{{- $s := .Values.notificationsController.metrics.service }}
apiVersion: v1
kind: Service
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.suffixedName" (list (include "patrol.notificationsName" .) "metrics")) "notifications-controller" $s.labels $s.annotations) | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    {{- include "patrol.selectorLabels" (list . "notifications-controller") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ $s.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
