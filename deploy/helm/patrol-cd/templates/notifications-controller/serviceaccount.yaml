{{- if and .Values.notificationsController.enabled .Values.notificationsController.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.notificationsController "notifications-controller")) "notifications-controller" dict .Values.notificationsController.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
