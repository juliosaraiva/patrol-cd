{{- if and .Values.notificationsController.enabled .Values.notificationsController.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.notificationsName" .) "notifications-controller" dict dict) | nindent 2 }}
spec:
  {{- include "patrol.pdbSpec" .Values.notificationsController.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "notifications-controller") | nindent 6 }}
{{- end }}
