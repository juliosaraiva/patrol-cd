{{- if and .Values.dex.enabled (not .Values.dex.existingConfigSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  {{- include "patrol.metadata" (list . (printf "%s-config" (include "patrol.dexName" .)) "dex-server" dict dict) | nindent 2 }}
stringData:
  config.yaml: |
    {{- include "patrol.dexConfig" . | nindent 4 }}
{{- end }}
