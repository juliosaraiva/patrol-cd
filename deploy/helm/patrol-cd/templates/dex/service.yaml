{{- if .Values.dex.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.dexName" .) "dex-server" dict dict) | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    {{- include "patrol.selectorLabels" (list . "dex-server") | nindent 4 }}
  ports:
    - name: http
      port: 5556
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 5557
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 5558
      targetPort: metrics
      protocol: TCP
{{- end }}
