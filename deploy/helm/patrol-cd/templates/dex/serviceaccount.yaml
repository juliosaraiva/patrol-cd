{{- if and .Values.dex.enabled .Values.dex.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.dex "dex-server")) "dex-server" dict .Values.dex.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
