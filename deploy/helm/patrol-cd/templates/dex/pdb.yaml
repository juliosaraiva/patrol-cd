{{- if and .Values.dex.enabled .Values.dex.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.dexName" .) "dex-server" dict dict) | nindent 2 }}
spec:
  maxUnavailable: {{ .Values.dex.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "dex-server") | nindent 6 }}
{{- end }}
