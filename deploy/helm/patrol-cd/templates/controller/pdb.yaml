{{- if and .Values.controller.enabled .Values.controller.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.controllerName" .) "controller" dict dict) | nindent 2 }}
spec:
  {{- include "patrol.pdbSpec" .Values.controller.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "controller") | nindent 6 }}
{{- end }}
