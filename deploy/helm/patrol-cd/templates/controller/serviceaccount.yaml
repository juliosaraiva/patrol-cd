{{- if and .Values.controller.enabled .Values.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.controller "controller")) "controller" dict .Values.controller.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
