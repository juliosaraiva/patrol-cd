{{- if and (include "patrol.commitServerEnabled" .) .Values.commitServer.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.commitServerName" .) "commit-server" dict dict) | nindent 2 }}
spec:
  {{- include "patrol.pdbSpec" .Values.commitServer.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "commit-server") | nindent 6 }}
{{- end }}
