{{- if and (include "patrol.commitServerEnabled" .) .Values.commitServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.commitServer "commit-server")) "commit-server" dict .Values.commitServer.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
