{{- if include "patrol.commitServerEnabled" . }}
{{- $v := .Values.commitServer }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.commitServerName" .) "commit-server" $v.labels $v.annotations) | nindent 2 }}
spec:
  replicas: {{ $v.replicas }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "commit-server") | nindent 6 }}
  strategy:
    {{- toYaml $v.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "patrol.podLabels" (list . $v "commit-server") | nindent 8 }}
      annotations:
        {{- include "patrol.podAnnotations" (list . $v (dict "checksum/cmd-params" (include "patrol.paramsChecksum" .))) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patrol.serviceAccountName" (list . $v "commit-server") }}
      # No Kubernetes API access: write credentials arrive with each request.
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with include "patrol.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "patrol.podSecurityContext" (list . $v) | nindent 8 }}
      {{- with include "patrol.scheduling" (list . $v "commit-server") }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- with $v.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: commit-server
          image: {{ include "patrol.patrolImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint (tini) stays PID 1: it forwards SIGTERM and reaps tool processes.
          args:
            - /usr/local/bin/patrolcd
            - commit-server
            {{- include "patrol.shutdownArg" . | nindent 12 }}
            - --work-dir=/var/lib/patrol/commit-server
            - --credentials-dir=/var/run/patrol/credentials
            {{- with $v.maxConcurrentRequests }}
            - --max-concurrent-requests={{ . }}
            {{- end }}
            {{- if include "patrol.tls.managed" . }}
            - --tls-cert=/app/config/commitserver/tls/tls.crt
            - --tls-key=/app/config/commitserver/tls/tls.key
            {{- if include "patrol.tls.mtls" . }}
            - --tls-client-ca=/app/config/commitserver/mtls/client-ca.crt
            {{- end }}
            {{- end }}
            {{- with $v.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patrol.commonEnv" (list . $v) | nindent 12 }}
            {{- with include "patrol.paramEnv" (list . "commit-server") }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with include "patrol.envFrom" (list . $v) }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: server
              containerPort: 8086
              protocol: TCP
            - name: metrics
              containerPort: 8087
              protocol: TCP
          readinessProbe:
            {{- include "patrol.probe" (list $v.probes.readiness "/readyz" "metrics" "HTTP") | nindent 12 }}
          livenessProbe:
            {{- include "patrol.probe" (list $v.probes.liveness "/livez" "metrics" "HTTP") | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "patrol.containerSecurityContext" (list . $v) | nindent 12 }}
          {{- with $v.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /var/lib/patrol/commit-server
            - name: credentials
              mountPath: /var/run/patrol/credentials
            {{- include "patrol.internalTokenMount" . | nindent 12 }}
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
              readOnly: true
            - name: tls-certs
              mountPath: /app/config/tls
              readOnly: true
            {{- if include "patrol.tls.managed" . }}
            - name: commit-server-tls
              mountPath: /app/config/commitserver/tls
              readOnly: true
            {{- if include "patrol.tls.mtls" . }}
            - name: client-ca
              mountPath: /app/config/commitserver/mtls
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with $v.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $v.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "patrol.tmpVolume" $v.emptyDirs.tmpSizeLimit | nindent 8 }}
        - name: work
          emptyDir:
            sizeLimit: {{ $v.emptyDirs.workSizeLimit }}
        - name: credentials
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.emptyDirs.credentialsSizeLimit }}
        {{- include "patrol.internalTokenVolume" (list . false) | nindent 8 }}
        - name: ssh-known-hosts
          configMap:
            name: patrol-ssh-known-hosts-cm
            optional: true
        - name: tls-certs
          configMap:
            name: patrol-tls-certs-cm
            optional: true
        {{- if include "patrol.tls.managed" . }}
        - name: commit-server-tls
          secret:
            secretName: patrol-commit-server-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if include "patrol.tls.mtls" . }}
        - name: client-ca
          secret:
            secretName: patrol-internal-client-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: client-ca.crt
        {{- end }}
        {{- end }}
        {{- with $v.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
