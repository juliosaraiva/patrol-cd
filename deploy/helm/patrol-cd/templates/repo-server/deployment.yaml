{{- if .Values.repoServer.enabled }}
{{- $v := .Values.repoServer }}
{{- $plugins := $v.cmp.plugins }}
{{- $mode := .Values.internalTLS.mode }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.repoServerName" .) "repo-server" $v.labels $v.annotations) | nindent 2 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "repo-server") | nindent 6 }}
  strategy:
    {{- toYaml $v.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "patrol.podLabels" (list . $v "repo-server") | nindent 8 }}
      annotations:
        {{- $sums := dict "checksum/cmd-params" (include "patrol.paramsChecksum" .) }}
        {{- if $plugins }}
        {{- $_ := set $sums "checksum/cmp-plugins" (include (print $.Template.BasePath "/repo-server/cmp-configmaps.yaml") . | sha256sum) }}
        {{- end }}
        {{- include "patrol.podAnnotations" (list . $v $sums) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patrol.serviceAccountName" (list . $v "repo-server") }}
      # No Kubernetes API access: the repo-server receives credentials per request only.
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with include "patrol.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "patrol.podSecurityContext" (list . $v) | nindent 8 }}
      {{- with include "patrol.scheduling" (list . $v "repo-server") }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- if or $plugins $v.initContainers }}
      initContainers:
        {{- if $plugins }}
        # Copies patrolcd into a shared volume: plugin sidecars run `patrolcd cmp-server` from
        # their own image.
        - name: copyutil
          image: {{ include "patrol.patrolImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml $v.cmp.copyutil.command | nindent 12 }}
          securityContext:
            {{- include "patrol.containerSecurityContext" (list . $v) | nindent 12 }}
          resources:
            {{- toYaml $v.cmp.copyutil.resources | nindent 12 }}
          volumeMounts:
            - name: var-files
              mountPath: /var/run/patrol
        {{- end }}
        {{- with $v.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: repo-server
          image: {{ include "patrol.patrolImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint (tini) stays PID 1: it forwards SIGTERM and reaps tool processes.
          args:
            - /usr/local/bin/patrolcd
            - repo-server
            {{- include "patrol.shutdownArg" . | nindent 12 }}
            - --root-dir=/var/lib/patrol/repo
            - --credentials-dir=/var/run/patrol/credentials
            - --gnupg-home-parent=/var/run/patrol/gnupg
            {{- if eq $mode "disabled" }}
            - --disable-tls
            {{- else if include "patrol.tls.managed" . }}
            - --tls-cert=/app/config/reposerver/tls/tls.crt
            - --tls-key=/app/config/reposerver/tls/tls.key
            {{- end }}
            {{- with $v.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patrol.commonEnv" (list . $v) | nindent 12 }}
            {{- with include "patrol.paramEnv" (list . "repo-server") }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "patrol.otlpHeadersEnv" (list . "PATROL_REPO_SERVER_OTLP_HEADERS") }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with include "patrol.envFrom" (list . $v) }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: server
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8084
              protocol: TCP
          readinessProbe:
            {{- include "patrol.probe" (list $v.probes.readiness "/readyz" "metrics" "HTTP") | nindent 12 }}
          livenessProbe:
            {{- include "patrol.probe" (list $v.probes.liveness "/healthz?full=true" "metrics" "HTTP") | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "patrol.containerSecurityContext" (list . $v) | nindent 12 }}
          {{- with $v.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /var/lib/patrol/repo
            - name: credentials
              mountPath: /var/run/patrol/credentials
            - name: gnupg
              mountPath: /var/run/patrol/gnupg
            {{- include "patrol.internalTokenMount" . | nindent 12 }}
            {{- with include "patrol.profileMount" (list . "repo-server") }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
              readOnly: true
            - name: tls-certs
              mountPath: /app/config/tls
              readOnly: true
            - name: gpg-keys
              mountPath: /app/config/gpg/source
              readOnly: true
            {{- if ne $mode "disabled" }}
            - name: repo-server-tls
              mountPath: /app/config/reposerver/tls
              readOnly: true
            {{- end }}
            {{- if include "patrol.tls.mtls" . }}
            - name: client-ca
              mountPath: /app/config/reposerver/mtls
              readOnly: true
            {{- end }}
            {{- if $plugins }}
            - name: plugins
              mountPath: /home/patrol/cmp-server/plugins
            {{- end }}
            {{- with $v.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- range $plugins }}
        {{- $p := . }}
        - name: cmp-{{ $p.name }}
          image: {{ include "patrol.image" (list $ $p.image "") }}
          imagePullPolicy: {{ $p.image.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml ($p.command | default (list "/var/run/patrol/patrolcd" "cmp-server")) | nindent 12 }}
          {{- with $p.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($p.resources | default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "1" "memory" "512Mi"))) | nindent 12 }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy $.Values.global.containerSecurityContext) (dict "runAsUser" 999 "runAsGroup" 999) (deepCopy ($p.containerSecurityContext | default dict))) | nindent 12 }}
          volumeMounts:
            - name: var-files
              mountPath: /var/run/patrol
              readOnly: true
            - name: plugins
              mountPath: /home/patrol/cmp-server/plugins
            - name: cmp-{{ $p.name }}-config
              mountPath: /home/patrol/cmp-server/config
              readOnly: true
            - name: cmp-{{ $p.name }}-tmp
              mountPath: /tmp
            {{- with $p.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with $v.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "patrol.tmpVolume" $v.emptyDirs.tmpSizeLimit | nindent 8 }}
        - name: work
          emptyDir:
            sizeLimit: {{ $v.emptyDirs.workSizeLimit }}
        - name: credentials
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.emptyDirs.credentialsSizeLimit }}
        - name: gnupg
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.emptyDirs.gnupgSizeLimit }}
        {{- include "patrol.internalTokenVolume" (list . false) | nindent 8 }}
        {{- with include "patrol.profileVolume" (list . "repo-server") }}
        {{- . | nindent 8 }}
        {{- end }}
        - name: ssh-known-hosts
          configMap:
            name: patrol-ssh-known-hosts-cm
            optional: true
        - name: tls-certs
          configMap:
            name: patrol-tls-certs-cm
            optional: true
        - name: gpg-keys
          configMap:
            name: patrol-gpg-keys-cm
            optional: true
        {{- if ne $mode "disabled" }}
        - name: repo-server-tls
          secret:
            secretName: patrol-repo-server-tls
            defaultMode: 0440
            {{- if not (include "patrol.tls.managed" .) }}
            # selfSigned: used when present, else the repo-server generates a certificate.
            optional: true
            {{- end }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if include "patrol.tls.mtls" . }}
        - name: client-ca
          secret:
            secretName: patrol-internal-client-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: client-ca.crt
        {{- end }}
        {{- if $plugins }}
        - name: var-files
          emptyDir:
            sizeLimit: 256Mi
        - name: plugins
          emptyDir:
            sizeLimit: 16Mi
        {{- range $plugins }}
        - name: cmp-{{ .name }}-config
          configMap:
            name: {{ .configMap | default (printf "%s-cmp-%s" (include "patrol.repoServerName" $) .name) }}
        - name: cmp-{{ .name }}-tmp
          emptyDir:
            sizeLimit: {{ .tmpSizeLimit | default "1Gi" }}
        {{- end }}
        {{- end }}
        {{- with $v.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
