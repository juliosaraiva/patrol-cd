{{- if and .Values.repoServer.enabled .Values.repoServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.repoServer "repo-server")) "repo-server" dict .Values.repoServer.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
