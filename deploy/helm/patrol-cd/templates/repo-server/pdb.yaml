{{- if and .Values.repoServer.enabled .Values.repoServer.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.repoServerName" .) "repo-server" dict dict) | nindent 2 }}
spec:
  {{- include "patrol.pdbSpec" .Values.repoServer.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "repo-server") | nindent 6 }}
{{- end }}
