{{- if and .Values.server.enabled .Values.server.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serverName" .) "server" dict dict) | nindent 2 }}
spec:
  {{- include "patrol.pdbSpec" .Values.server.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "server") | nindent 6 }}
{{- end }}
