{{- if and .Values.server.enabled .Values.server.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.server "server")) "server" dict .Values.server.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
