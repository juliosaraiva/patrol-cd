{{- if .Values.appsetController.enabled }}
{{- $v := .Values.appsetController }}
{{- $clients := dict "repo" true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.appsetName" .) "applicationset-controller" $v.labels $v.annotations) | nindent 2 }}
spec:
  replicas: {{ $v.replicas }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" (list . "applicationset-controller") | nindent 6 }}
  strategy:
    {{- toYaml $v.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "patrol.podLabels" (list . $v "applicationset-controller") | nindent 8 }}
      annotations:
        {{- include "patrol.podAnnotations" (list . $v (dict "checksum/cmd-params" (include "patrol.paramsChecksum" .))) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patrol.serviceAccountName" (list . $v "applicationset-controller") }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with include "patrol.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "patrol.podSecurityContext" (list . $v) | nindent 8 }}
      {{- with include "patrol.scheduling" (list . $v "applicationset-controller") }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- with $v.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: applicationset-controller
          image: {{ include "patrol.patrolImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint (tini) stays PID 1: it forwards SIGTERM and reaps tool processes.
          args:
            - /usr/local/bin/patrolcd
            - appset-controller
            {{- include "patrol.shutdownArg" . | nindent 12 }}
            - --metrics-addr=:8080
            - --healthz-addr=:8081
            {{- if $v.leaderElection }}
            - --enable-leader-election
            {{- end }}
            {{- if $v.webhook.enabled }}
            - --webhook-addr=:{{ $v.webhook.port }}
            {{- end }}
            {{- with include "patrol.repoClientArgs" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $v.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "patrol.commonEnv" (list . $v) | nindent 12 }}
          {{- with include "patrol.envFrom" (list . $v) }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
            {{- if $v.webhook.enabled }}
            - name: webhook
              containerPort: {{ $v.webhook.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            {{- include "patrol.probe" (list $v.probes.readiness "/readyz" "probes" "HTTP") | nindent 12 }}
          livenessProbe:
            {{- include "patrol.probe" (list $v.probes.liveness "/livez" "probes" "HTTP") | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "patrol.containerSecurityContext" (list . $v) | nindent 12 }}
          {{- with $v.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "patrol.internalTokenMount" . | nindent 12 }}
            {{- with include "patrol.profileMount" (list . "applicationset-controller") }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "patrol.internalClientMounts" (list . $clients) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $v.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $v.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "patrol.tmpVolume" "1Gi" | nindent 8 }}
        {{- include "patrol.internalTokenVolume" (list . false) | nindent 8 }}
        {{- with include "patrol.profileVolume" (list . "applicationset-controller") }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with include "patrol.internalClientVolumes" (list . $clients) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $v.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
