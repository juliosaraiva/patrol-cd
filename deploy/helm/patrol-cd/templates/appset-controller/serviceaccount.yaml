{{- if and .Values.appsetController.enabled .Values.appsetController.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "patrol.metadata" (list . (include "patrol.serviceAccountName" (list . .Values.appsetController "applicationset-controller")) "applicationset-controller" dict .Values.appsetController.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
