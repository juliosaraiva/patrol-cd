# internal/clusters (destination cluster access) and internal/clusters/k8sauth. See
# docs/architecture/components/clusters.md. Library-level evidence: the controller, API server,
# CLI and UI do not use the package yet, so features with surfaces or loops outside it are
# in-progress. envtest tests run against a real kube-apiserver 1.36 with the generated Cluster
# CRD and RBAC (no controllers; the token controller is emulated by the tests). Cloud endpoints
# (STS, Google OAuth, Entra ID) and remote API servers are local fakes.
# Commands and results: docs/architecture/components/clusters.md#verification.

