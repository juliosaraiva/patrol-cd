    resourceActionParameters); there is no separate /v2 path. Patrol refuses disabled actions and
    parameters the action's discovery does not declare (upstream accepts both).

API-024:
  status: implemented
  impl: [internal/apiserver/services/applications/logs.go, pkg/apiclient/application_resources.go]
  tests:
    - internal/apiserver/services/applications/logs_test.go:TestApplicationLogs
    - internal/apiserver/services/applications/logs_test.go:TestApplicationLogsAuthorization
    - internal/apiserver/services/applications/logs_test.go:TestApplicationLogsFollow
    - internal/apiserver/services/applications/resource_internal_test.go:TestSelectPods
    - internal/apiserver/services/applications/resource_internal_test.go:TestMergeLogs
    - internal/apiserver/services/applications/resource_internal_test.go:TestReadLogLines
  notes: >-
    Pods of the managed tree selected directly or through ancestors, server.maxPodLogsToRender
    (more pods than the value refused, 0 refuses every pod as upstream; no pod is an empty stream),
    merge by timestamp (100 ms window), filter with "!" and matchCase, untilTime, sinceTime,
    sinceSeconds, tailLines, previous, container, follow; pod stream errors become a line.
    Patrol additions: lines truncated at 64 KiB, 2000 lines/s rate limit, 256 MiB per stream,
    session and permission re-checks every minute (401/403 error event), a line without a
    timestamp keeps the previous one (upstream ends the stream).

