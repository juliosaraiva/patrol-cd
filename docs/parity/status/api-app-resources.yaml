  tests:
    - internal/apiserver/services/applications/resource_test.go:TestGetResource
    - internal/apiserver/services/applications/resource_test.go:TestPatchResource
    - internal/apiserver/services/applications/resource_test.go:TestDeleteResource
  notes: >-
    Node with UID of the tree (managed or orphaned) else 400 "<kind> <group> <name> not found as
    part of application <app>"; version override; Secret data and sensitive annotations masked;
    patch types json/merge/strategic (or their media types) in the body; failed Secret patches
    report only "failed to patch Secret ns/name"; delete propagation orphan > force > foreground;
    ResourceUpdated/ResourceDeleted events with the upstream messages.

API-023:
  status: implemented
  impl: [internal/apiserver/services/applications/actions.go, pkg/apiclient/application_resources.go]
