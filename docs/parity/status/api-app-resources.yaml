API-044:
  status: implemented
  impl:
    - internal/apiserver/services/applications/terminal.go
    - internal/apiserver/services/applications/terminal_exec.go
    - pkg/apiclient/application_resources.go
  tests:
    - internal/apiserver/services/applications/terminal_test.go:TestTerminalSession
    - internal/apiserver/services/applications/terminal_test.go:TestTerminalRefusals
    - internal/apiserver/services/applications/terminal_test.go:TestTerminalRevocationAndIdle
    - internal/apiserver/services/applications/resource_internal_test.go:TestParseTerminalRequest
    - internal/apiserver/services/applications/resource_internal_test.go:TestTerminalOriginAllowed
    - pkg/apiclient/application_resources_test.go:TestTerminalClient
  notes: >-
    exec.enabled (404), exec.shells with fallback, name validation messages, pod of the tree,
    running container, resize, permission re-check on every message and session/application
    re-check every 30 s, keepalive pings. Differences: RBAC denials are 403 (upstream 401), a
    wrong project is 404 (existence hiding), same-origin handshakes only (upstream accepts any
    origin), idle timeout (30 min), start/end audit entries; the exec uses the Kubernetes
    WebSocket channel protocol v5/v4 only (no SPDY fallback, client-go remotecommand is not a
    module dependency).

