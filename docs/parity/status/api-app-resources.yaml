# Resource-level application API (internal/apiserver/services/applications: resource tree and
# its stream, managed resources, server-side diff, events, live resource get/patch/delete,
# resource actions, pod logs, web terminal) and its pkg/apiclient types and methods. See
# docs/architecture/components/api-app-resources.md.
# Evidence: tests through pkg/apiclient against the real route chain (auth.TokenService SSO
# sessions, rbac.Enforcer, audit with a Kubernetes Event recorder), an envtest kube-apiserver
# 1.36 that is both the control plane and the destination cluster (with Kubernetes RBAC applied
# to impersonated service accounts), the real internal/controller/treeapi handler and client
# in front of a fake StateProvider (no controller computes trees), the real internal/project
# lookups and internal/lua runtime with the built-in customizations. pods/log and pods/exec are
# served by an in-process kubelet stand-in behind the same proxy (envtest has no kubelet). The
# service is not wired into the patrol-server command yet, so nothing here is "verified".
# Commands and results: docs/architecture/components/api-app-resources.md#verification.

API-004:
  status: implemented
  impl: [internal/apiserver/services/applications/logs.go, pkg/apiclient/application_resources.go]
  tests:
    - internal/apiserver/services/applications/logs_test.go:TestApplicationLogs
    - pkg/apiclient/application_resources_test.go:TestApplicationResourceClientRequests
  notes: >-
    Logs part: SSE log streams and download=true (application/octet-stream,
    attachment;filename="<ns>-<pod>-<container>.log", "log.log" when a part is not a valid name,
    stops at the last entry, error text written to the body). Events are bare LogEntry JSON (no
    {"result": ...} gRPC-gateway envelope). The watch/tree streams are the framework's and the
    applications service's.

API-021:
  status: implemented
  impl:
    - internal/apiserver/services/applications/tree.go
    - internal/apiserver/services/applications/diff.go
    - pkg/apiclient/application_resources.go
  tests:
    - internal/apiserver/services/applications/tree_test.go:TestResourceTree
    - internal/apiserver/services/applications/tree_test.go:TestResourceTreeCacheMiss
    - internal/apiserver/services/applications/tree_test.go:TestWatchResourceTree
    - internal/apiserver/services/applications/tree_test.go:TestManagedResources
    - internal/apiserver/services/applications/tree_test.go:TestServerSideDiff
    - internal/apiserver/services/applications/resource_internal_test.go:TestMaskResourceDiff
  notes: >-
    Trees, managed resources and server-side diffs come from the controller replica owning the
    application (tree API); a missing state triggers a normal refresh (upstream
    getCachedAppState) or reports the ComparisonError/InvalidSpecError conditions (412). The
    stream polls with ETags (3 s) and on Application events, authorizes every event, ends with
    DELETED or a 403 error event. Server-side diff is POST with a JSON body (contract) instead of
    GET with repeated query parameters; Secret results are masked again at the API. The API
    checks live states against their declared identities (upstream messages) and refuses a
    target manifest paired with a live state that names another object (400; upstream does not
    check targets, so the controller would dry-run apply any object with its credentials).

