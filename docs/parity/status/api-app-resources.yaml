    - internal/apiserver/services/applications/actions_test.go:TestRunResourceAction
    - internal/apiserver/services/applications/actions_test.go:TestRunCreateAction
    - internal/apiserver/services/applications/actions_test.go:TestApplicationSelfAction
  notes: >-
