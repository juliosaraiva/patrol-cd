OPS-007:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/rbac]
  tests: [deploy/helm/patrol-cd/ci/default.yaml, deploy/helm/patrol-cd/ci/hardened.yaml]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    Controller ClusterRole cluster-admin-equivalent by default (rbac.controller.clusterAdmin) or
    a rules list (ci/hardened.yaml names the writable resources, so no subresource, node,
    namespace or RBAC writes, but its read-everything rule and workload/Secret writes still
    allow escalation; documented in installation.md "Hardened installation"); server
    ClusterRole get/patch/delete any resource, list events, get pods and pods/log, create Jobs,
    optional pods/exec and serviceaccounts impersonate. The ApplicationSet
    controller has no ClusterRole unless applicationSetNamespaces needs one (upstream grants it
    unconditionally). Rules derived from the components' API calls; their sufficiency was
    exercised against envtest with the real binaries and the RBAC authorizer
    (deploy-validation.yaml OPS-007). On kind (2026-10-19) the default ClusterRoles were in
    effect while the components worked, but no check there asserts a cluster-scoped rule, and
    every Application targeted the external cluster patrol-target (reached with the registered
    Cluster's ServiceAccount token, not these ClusterRoles), so the row stays in-progress.

OPS-008:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/rbac/_rules.tpl]
  tests: [deploy/helm/patrol-cd/ci/all-features.yaml (make helm-lint)]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    Per-component Roles in the release namespace and in literal application/ApplicationSet
    namespaces; repo-server, commit-server and Dex have ServiceAccounts without RBAC and no
    mounted token; the notifications controller lists and watches every ConfigMap and Secret of
    the release namespace (settings informers, repository lister; as upstream) and gets its
    named ConfigMaps and Secret; a separate bootstrap Role (create Secrets; get the three
    bootstrap Secrets; update patrol-secret; delete patrol-initial-admin-secret only; get
    patrol-cm) bound to the primary workload. With serviceAccount.create=false the render fails
    unless serviceAccount.name is set (never the namespace's default ServiceAccount;
    hack/helmdocs TestServiceAccountNameRequired, ci/invalid/serviceaccount-without-name.yaml).
    Operations creators get the impersonate verb the admission policy checks. Sufficiency
    exercised against envtest (deploy-validation.yaml OPS-008, audit log). On kind (2026-10-19,
    default profile) the components ran with these Roles while hack/kind/verify-install.sh
    passed (bootstrap, login, default AppProject, Operations created by API syncs, a re-install
    replacing the stale initial admin Secret with the bootstrap Role's delete rule), but no
    kind check asserts a rule or the absence of forbidden requests; the repo-server running
    without a token was observed by hand only. The row stays in-progress.

OPS-010:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/networkpolicy]
  tests:
    - deploy/helm/patrol-cd/ci/hardened.yaml (make helm-lint)
    - deploy/helm/patrol-cd/ci/ingress-nginx.yaml
    - hack/helmdocs/behavior_test.go:TestNetworkPolicyExcept
    - hack/helmdocs/render_test.go:TestRenderedProfiles
    - hack/kind/verify-install.sh:netpol (repo-server egress allowed on the configured ports, refused to kubernetes.default.svc:443 and controller 8090)
    - hack/kind/verify-install.sh:metrics (four metrics endpoints answer from another namespace)
  evidence: docs/verification/runs/2026-10-19-kind-validation.md; docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    Stricter than upstream (ingress-only, server open): every component restricts ingress and
    egress (DNS, API server, peer components, configurable external CIDR/port sets, metrics
    scrapers). except entries are attached only to the CIDRs that strictly contain them (render
    check of every profile), and the repo-server and commit-server egress excludes the cloud
    metadata endpoints by default (networkPolicy.excludeMetadataEndpoints). Enforcement was
    exercised on kind (2026-10-19, kindnet enforces NetworkPolicy; default profile with
    hack/kind/values.yaml, which adds repo-server egress ports 2222, 5000 and 8080).
    hack/kind/verify-install.sh asserts from the repo-server pod: the git server's Services on
    80 and 22 (pods on 8080 and 2222) and patrol-registry:5000 are reachable;
    kubernetes.default.svc:443 and the controller's port 8090 are not; and the four metrics
    endpoints (8082, 8083, 8084, 9001) answer from namespace patrol-e2e; everything else in the
    run (bootstrap, API, 7 syncs, drift) worked with the policies enforced. Observed (KV-3):
    NetworkPolicy ports are the destination pod's ports after Service translation, so the
    default repo-server egress ports (22, 80, 443) block in-cluster servers whose pods listen on
    other ports (the fixtures until the extra ports were set); kindnet matches pod IPs with an
    ipBlock of 0.0.0.0/0 (temporary manual policies, other CNIs may not). Both refusals are
    explained by the repo-server's egress ports alone (the kind API server endpoint listens on
    6443; 8090 is not listed), so they show neither a rule that excludes those peers nor the
    controller's ingress policy at work; an API server endpoint on 443 would match the default
    repo-server egress (inferred from the policy, not tested; the repo-server has no token).
    Not tested: any ingress refusal (e.g. an unlisted pod reaching repo-server
    8081 or controller 8090), the egress limits of the other components, the metadata-endpoint
    exclusion, other CNIs. The row stays in-progress.

