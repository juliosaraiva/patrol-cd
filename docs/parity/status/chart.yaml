# Helm chart (deploy/helm/patrol-cd, hack/helmdocs, hack/deploy.mk). Guide:
# docs/guides/installation.md; commands and results:
# docs/verification/runs/2026-10-17-chart-static.md.
# Evidence level: static only (helm lint --strict and helm template of every profile,
# deterministic renders, schema/validation negative tests, strict typed decoding of the rendered
# objects, flag names checked against the help goldens). Nothing has been installed on a cluster
# from this chart yet (image build and kind blocked, TASKS.md), so statuses stay in-progress
# until the deployment validation harness and kind exercise them.

OPS-001:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates, deploy/helm/patrol-cd/values.yaml]
  tests: [deploy/helm/patrol-cd/ci/default.yaml (make helm-lint, make helm-template)]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    The default chart values render the cluster-scoped install: 8 CRDs plus the Operation
    ValidatingAdmissionPolicy and binding, the settings ConfigMaps (patrol-cm with the shipped
    defaults), an empty patrol-secret, patrol-notifications-cm/-secret, server Deployment,
    controller StatefulSet, repo-server, ApplicationSet and notifications controllers, Services,
    ServiceAccounts, Roles and ClusterRoles, NetworkPolicies, PDBs. No Redis (ADR-0004); Dex off
    by default. Cluster-scoped objects are named <namespace>-<prefix>-<component> and bind
    ServiceAccounts of the release namespace, so no ClusterRoleBinding patch is needed for
    another namespace (upstream edge case). Not installed on a cluster yet.

OPS-002:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/rbac, deploy/helm/patrol-cd/ci/namespaced.yaml]
  tests: [deploy/helm/patrol-cd/ci/namespaced.yaml (make helm-lint), deploy/helm/patrol-cd/ci/invalid/namespaced-with-app-namespaces.yaml]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    rbac.scope=namespaced with crds.install=false and crds.admissionPolicy=false renders no CRD,
    no admission policy, no ClusterRole or ClusterRoleBinding; the controller and server get
    Roles in the release namespace and rbac.managedNamespaces. Combining it with
    applicationNamespaces is refused. Not installed on a cluster yet.

OPS-003:
  status: in-progress
  impl: [deploy/helm/patrol-cd/ci/core.yaml, deploy/helm/patrol-cd/templates/_bootstrap.tpl]
  tests: [deploy/helm/patrol-cd/ci/core.yaml (make helm-lint, make helm-template)]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    server.enabled=false: no patrol-server, Ingress, Dex or server ClusterRole; the bootstrap
    init container moves to the controller (optional internal token mount, bootstrap Role bound
    to the controller ServiceAccount). Differs from upstream core-install in keeping the
    notifications controller (switchable) and having no Redis. Not installed on a cluster yet.

OPS-004:
  status: in-progress
  impl: [deploy/helm/patrol-cd/ci/ha.yaml, deploy/helm/patrol-cd/templates/_helpers.tpl]
  tests: [deploy/helm/patrol-cd/ci/ha.yaml (make helm-lint, make helm-template)]
  evidence: docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    HA profile: three controller shards (Lease-coordinated, ADR-0008), HPAs for server and
    repo-server, two leader-elected ApplicationSet and notifications replicas, required pod
