# Helm chart (deploy/helm/patrol-cd, hack/helmdocs, hack/deploy.mk). Guide:
# docs/guides/installation.md; commands and results:
# docs/verification/runs/2026-10-17-chart-static.md.
# Evidence level: static (helm lint --strict and helm template of every profile, deterministic
# renders, schema/validation negative tests, strict typed decoding of the rendered objects, flag
# names checked against the help goldens); the deployment validation harness against envtest
# (deploy-validation.yaml); and, for the default profile only, the kind validation of
# 2026-10-19 (docs/verification/runs/2026-10-19-kind-validation.md): `make kind-install`
# (hack/kind/install.sh, the chart with hack/kind/values.yaml: local image, NodePort 30443, extra
# repo-server egress ports) and `make kind-verify VERIFY_FLAGS=--lifecycle`
# (hack/kind/verify-install.sh): clean-room run 55 of 55 checks with the script as it was then
# (docs/verification/log.md V-0031); closing clean-room run after the review fixes, 58 of 58
# checks (V-0032). Limits of that run: one CNI (kindnet), linux/arm64 only, one replica per
# component, Kubernetes v1.36.4 nodes; no SSO, no ingress, no ApplicationSets, no hydrator, no
# CMP, no browser. The other profiles were not installed on a cluster with nodes. A row is
# raised to verified only where kind checks cover every test the parity area requires for it
# (docs/parity/areas/10-operations.md); none of the rows below is.

OPS-001:
  status: implemented
  impl: [deploy/helm/patrol-cd/templates, deploy/helm/patrol-cd/values.yaml]
  tests:
    - deploy/helm/patrol-cd/ci/default.yaml (make helm-lint, make helm-template)
    - hack/kind/verify-install.sh:pods (exactly 5 Patrol pods, all Running and ready, 0 restarts)
    - hack/kind/verify-install.sh:security (per component uid 999, an empty capability bounding set, no_new_privs, root file system mounted read-only; until the review it checked the effective capabilities and a failing write instead)
    - hack/kind/verify-install.sh:bootstrap and api (init container converged; /healthz 200 through NodePort 30443; anonymous project list 401; admin login 200; AppProject default exists)
    - hack/kind/verify-install.sh:sync (7 fixture Applications of seven source types synced through the API, ending Synced/Healthy/Succeeded; their workloads fully available on patrol-target)
    - hack/kind/verify-install.sh:drift (a Deployment scaled on patrol-target reported OutOfSync; a new sync restores 1 replica)
    - hack/kind/verify-install.sh --lifecycle (helm rollback to revision 1, upgrade, uninstall keeps the 8 CRDs and 7 Applications, install again, workloads on patrol-target keep running)
  evidence: docs/verification/runs/2026-10-19-kind-validation.md; docs/verification/runs/2026-10-17-chart-static.md
  notes: >-
    The default chart values render the cluster-scoped install: 8 CRDs plus the Operation
    ValidatingAdmissionPolicy and binding, the settings ConfigMaps (patrol-cm with the shipped
    defaults), an empty patrol-secret, patrol-notifications-cm/-secret, server Deployment,
    controller StatefulSet, repo-server, ApplicationSet and notifications controllers, Services,
    ServiceAccounts, Roles and ClusterRoles, NetworkPolicies, PDBs. No Redis (ADR-0004); Dex off
    by default. Cluster-scoped objects are named <namespace>-<prefix>-<component> and bind
    ServiceAccounts of the release namespace, so no ClusterRoleBinding patch is needed for
    another namespace (upstream edge case). Installed on kind (2026-10-19) into namespace patrol
    of patrol-control with hack/kind/values.yaml, which differs from the defaults only in the
    image (patrol-cd/patrol-cd:dev, loaded into the nodes), the server Service type (NodePort
    30443) and the repo-server egress ports (22, 80, 443, 2222, 5000, 8080; finding KV-3): the
    checks listed in tests passed in a clean-room run (make kind-down image kind-up
    kind-fixtures kind-install, then make kind-verify VERIFY_FLAGS=--lifecycle; V-0031, with the
    script as it was before the review; the closing run with the current script is V-0032). The only
    destination was the registered external cluster patrol-target; an Application targeting
    https://kubernetes.default.svc ran only in the envtest harness (deploy-validation.yaml).
    helm uninstall removes chart-managed ConfigMaps, so host keys added to
    patrol-ssh-known-hosts-cm after the install are lost on a re-install (KV-10). Limits: one
    CNI (kindnet), linux/arm64, one replica per component, Kubernetes v1.36.4; seccomp and the
    repo-server's missing service account token were observed by hand only. Status
    implemented, not verified (review of 2026-10-19, finding F7): the area requires, besides all
    pods Ready, an Application targeting https://kubernetes.default.svc that syncs, a golden
    inventory of the installed objects, and recovery (delete a component's pod: recreated and
    functional; re-apply is idempotent). On a cluster with nodes the in-cluster destination and
    the pod-deletion recovery were not exercised (the in-cluster sync and the idempotent no-op
    upgrade ran only against envtest with emulated pods, deploy-validation.yaml, and no harness
    deletes a pod), so the kind checks listed in tests cover part of the feature.
    hack/kind/install.sh (make kind-install) installs the chart for these checks but asserts
    nothing beyond helm's --wait.

