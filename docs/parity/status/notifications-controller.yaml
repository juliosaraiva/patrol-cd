NOTIF-053:
  status: implemented
  impl: [internal/notifications/controller/reconciler.go]
  tests:
    - internal/notifications/controller/envtest_test.go:TestDeliveryFailureEmitsEventAndMetricThenRetries
    - internal/notifications/controller/envtest_test.go:TestTenantNamespaceEventsAndEgressIsolation
    - internal/notifications/controller/reconciler_test.go:TestReport
    - internal/notifications/controller/reconciler_test.go:TestFailureNote
  notes: >-
    Failure → log, succeeded="false", Warning Event; retried with 5s doubling backoff
    (capped by resync) until delivered; other destinations unaffected. Events (a Patrol
    addition) about Applications outside the failing configuration's namespace carry only
    trigger, service and failure class, never the control-plane URL or response body.

NOTIF-054:
  status: implemented
  impl: [internal/notifications/controller/engines.go, internal/notifications/controller/reconciler.go, internal/notifications/controller/run.go]
  tests:
    - internal/notifications/controller/envtest_test.go:TestSelfServiceNamespaceConfigurationIsolation
    - internal/notifications/controller/envtest_test.go:TestTenantNamespaceEventsAndEgressIsolation
    - internal/notifications/controller/engines_test.go:TestEngineFactorySelfService
    - internal/notifications/controller/engines_test.go:TestEngineFactoryTenantEgress
    - internal/notifications/controller/config_test.go:TestConfigCompleteTenantNetwork
    - internal/notifications/controller/reconciler_test.go:TestSuppressFailure
  notes: >-
    Namespace configurations apply only to their namespace's Applications, resolve $keys only
    from their own Secret, .secrets hidden everywhere; disabled flag ignores them. They always
    deliver through the SSRF-guarded dialer opened only by TenantEgressAllowedPrefixes (the
    control-plane AllowPrivateEgress/EgressAllowedPrefixes never apply; upstream has no
    guard). Flag wiring is the command's.

