# internal/notifications/controller (notifications controller). See
# docs/architecture/components/notifications-controller.md.
# Evidence: unit tests plus envtest (real kube-apiserver 1.36 with the generated CRDs, httptest
# webhook receivers). The patrolcd command, its flags, the metrics HTTP server, install
# manifests and the CLI are not built yet, so features exposed through them are at most
# implemented. Commands and results: notifications-controller.md#verification.

NOTIF-001:
  status: in-progress
  impl: [internal/notifications/controller/run.go]
  tests:
    - internal/notifications/controller/envtest_test.go:TestControllerDeliversOnTransitionsAndDeduplicatesAcrossRestart
    - internal/notifications/controller/envtest_config_test.go:TestConcurrentProcessorsWithLeaderElection
    - internal/notifications/controller/envtest_config_test.go:TestRunRejectsInvalidConfiguration
  notes: >-
    Run(ctx, Config) starts informers for Applications, AppProjects and the notifications
    ConfigMap/Secret, waits for sync, returns nil on cancellation after recording deliveries.
    Optional leader election (Patrol runs it leader-elected; upstream has none). The
    patrolcd multi-call command and its error messages are not built.

NOTIF-002:
  status: implemented
  impl: [internal/notifications/controller/scope.go, internal/notifications/controller/run.go, internal/notifications/controller/reconciler.go]
  tests:
    - internal/notifications/controller/scope_test.go:TestNamespaceMatcher
    - internal/notifications/controller/scope_test.go:TestNamespaceMatcherInvalidPatterns
    - internal/notifications/controller/config_test.go:TestConfigCompleteWarnsAboutUnsupportedNamespaceExpressions
    - internal/notifications/controller/envtest_test.go:TestApplicationScopeAndLabelSelector
    - internal/notifications/controller/envtest_test.go:TestSelfServiceNamespaceConfigurationIsolation
    - internal/notifications/controller/envtest_test.go:TestProjectLevelSubscriptions
    - internal/notifications/controller/reconciler_test.go:TestReconcileScope
  notes: >-
    Globs and /regexp/ entries; literal lists restrict the cache to those namespaces. An
    entry that cannot be compiled is logged and never matches; the start is not failed.
    Different by design: regular expressions are Go RE2, upstream uses regexp2, so
    lookaround entries (e.g. the documented /^((?!not-allowed).)*$/) match upstream but never
    here, as in internal/webhook and internal/project (notifications-controller.md#deviations-deliberate).
    Flag/env wiring is the command's.

