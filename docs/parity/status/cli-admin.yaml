# internal/cli/admin (`patrol admin`). See docs/architecture/components/cli-admin.md.
# Commands that talk to Kubernetes are tested against a real kube-apiserver (envtest 1.36) through
# the cobra command tree; offline commands are tested with real inputs and no fakes. The command
# group is not wired into cmd/patrol yet (CLI core workstream).

API-076:
  status: verified
  impl: [internal/cli/admin/admin.go, internal/cli/admin/factory.go, internal/cli/admin/kube.go]
  tests:
    - internal/cli/admin/misc_test.go:TestAdminHelpListsCommands
  notes: >-
    admin.Register(root, factory) adds the group with kubectl connection flags; --logformat and
    --loglevel are accepted on admin itself as upstream. Not yet registered by cmd/patrol.

API-077:
  status: verified
  impl: [internal/cli/admin/app.go, internal/cli/admin/appspec.go, internal/cli/admin/reconcile.go]
  tests:
    - internal/cli/admin/app_test.go:TestAppGenerateSpecGolden
    - internal/cli/admin/app_test.go:TestAppGenerateSpecVariants
    - internal/cli/admin/app_test.go:TestAppGenerateSpecInline
    - internal/cli/admin/app_test.go:TestDiffReconcileResults
    - internal/cli/admin/app_test.go:TestGetReconcileResults
  notes: >-
    get-reconcile-results --refresh runs the comparison in-process against envtest with a real
    repo-server (internal/reposerver over HTTP) and a local git repository.

API-078:
  status: verified
  impl: [internal/cli/admin/cluster.go, internal/cli/admin/clusterspec.go]
  tests:
    - internal/cli/admin/cluster_test.go:TestClusterStatsAndShards
    - internal/cli/admin/cluster_test.go:TestClusterNamespacesAndNamespacedMode
    - internal/cli/admin/cluster_test.go:TestClusterKubeconfig
    - internal/cli/admin/cluster_test.go:TestClusterGenerateSpec
    - internal/cli/admin/cluster_test.go:TestClusterGenerateSpecBearerToken
  notes: >-
    No Redis (ADR-0004): stats/shards read Cluster.status written by the controller (seeded in the
    tests) and accept the Redis flags with a warning. generate-spec emits a Cluster plus credentials
    Secret (ADR-0003). kubeconfig also accepts one argument (redacted stdout). The SA token
    controller is emulated in the --generate-bearer-token test (envtest has none).

API-079:
  status: implemented
  impl: [internal/cli/admin/dashboard.go, internal/cli/admin/portforward.go]
  tests:
    - internal/cli/admin/dashboard_test.go:TestDashboardProxiesThroughPortForward
    - internal/cli/admin/dashboard_test.go:TestDashboardVerifiesPatrolServer
    - internal/cli/admin/dashboard_test.go:TestPortForwardProtocol
    - internal/cli/admin/dashboard_test.go:TestDashboardClusterLookups
  notes: >-
    Different by design (docs/architecture/components/cli-admin.md#dashboard): a loopback proxy to a
    running patrol-server through pods/portforward, login required, TLS verified (pinned tls.crt of
    patrol-secret). The WebSocket port-forward was only exercised against a protocol-faithful fake
    (no kubelet in envtest, no kind cluster available), hence implemented.

API-080:
  status: verified
  impl: [internal/cli/admin/export.go, internal/cli/admin/import.go, internal/cli/admin/backup.go]
  tests:
    - internal/cli/admin/backup_test.go:TestExportImportRoundTrip
    - internal/cli/admin/backup_test.go:TestImportDryRunAndPrune
    - internal/cli/admin/backup_test.go:TestExportWithoutSecretsAndWithOperations
    - internal/cli/admin/backup_test.go:TestExportRequiresSettingsConfigMaps
    - internal/cli/admin/backup_test.go:TestImportRefusesForeignGroups
    - internal/cli/admin/backup_test.go:TestImportDropsDanglingOwnerReferences
    - internal/cli/admin/backup_test.go:TestImportPruneOfSecretlessBackupKeepsSecrets
    - internal/cli/admin/backup_test.go:TestImportPruneSecretScope
    - internal/cli/admin/backup_test.go:TestImportPruneReleasesOwnedObjects
    - internal/cli/admin/backup_test.go:TestIsPatrolSecret
  notes: >-
    Prune differences from upstream (safety): Secrets are pruned only when the backup contains
    Secrets (--include-secrets=false backups prune none), only Patrol-managed Secrets (upstream
    isArgoCDSecret rule; referenced-only Secrets are exported and restored but never pruned),
    patrol-secret and patrol-notifications-secret are never pruned, and objects owned by a
    pruned ApplicationSet/Repository/RepositoryCredential/Cluster/SCMProvider are released
    (owner reference removed) before the owner is deleted, so nothing cascades.

