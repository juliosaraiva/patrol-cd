# docs/architecture/components/reposerver.md. Evidence: package tests through the real HTTP
# client against httptest servers with real git/helm/kustomize/gpg binaries, local bare
# repositories, an httptest Helm repository and the in-process OCI registry. The controller,
# API server and ApplicationSet controller do not call the repo-server over HTTP yet, so
# features stay "implemented".

