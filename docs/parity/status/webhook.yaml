# internal/webhook (SCM and registry webhook ingestion). See
# docs/architecture/components/webhook.md. patrol-server mounts the handler at /api/webhook
# (internal/server/server_routes.go). It is tested through ServeHTTP with fake and envtest
# API servers; endpoint features are recorded as `implemented`, not `verified`. Settings
# parsing of the same keys is tracked in settings.yaml.

REPO-114:
  status: implemented
  impl: [internal/webhook/handler.go, internal/webhook/providers.go, internal/webhook/config.go]
  tests:
    - internal/webhook/handler_test.go:TestHTTPSemantics
    - internal/webhook/handler_test.go:TestProviderDeliveries
    - internal/webhook/handler_test.go:TestStartLifecycle
    - internal/webhook/ghcr_test.go:TestWorkerPanicRecovery
    - internal/webhook/hardening_test.go:TestInFlightBodyBudget
    - internal/webhook/hardening_test.go:TestLogValuesBounded
    - internal/webhook/envtest_test.go:TestEnvtestWebhookRefresh
  notes: >-
    /api/webhook with upstream header detection order (Azure DevOps, Gitea, Gogs, GitHub,
    GitLab, Bitbucket Cloud, Bitbucket Server, GHCR) and /api/webhook/{provider}; upstream
    status codes and bodies (400 unknown event, 405, 400 valid-JSON-under-N-MB with the
    effective limit, 401 GHCR, 503 queue full); asynchronous workers with panic recovery and
    draining on shutdown. Additions: 404 for unknown provider paths, 429 per-source rate
    limit, 503 "Webhook server is busy" when the global in-flight body budget is exhausted,
    byte-bounded queue, untrusted values clipped in logs. Served by patrol-server at
    /api/webhook and /api/webhook/{provider} (internal/server/server_routes.go). A body whose
    Content-Length exceeds the server's global cap (64 MiB) is answered 413 before the handler
    runs; a chunked body reaches the handler and gets its 400.

REPO-115:
  status: different-by-design
  impl: [internal/webhook/handler.go, internal/webhook/config.go]
  tests:
    - internal/webhook/handler_test.go:TestProviderDeliveries
    - internal/webhook/handler_test.go:TestHTTPSemantics
    - internal/webhook/hardening_test.go:TestEffectivePayloadLimit
  notes: >-
    Raw body read with the webhook.maxPayloadSizeMB cap (Content-Length checked first, then
    limit+1 bytes read) before parsing; "0 MB" for limits below 1 MB as upstream; read per
    request, so changes apply without a restart. Difference: the setting is clamped to
    25 MiB, the cap every pkg/scm verifier enforces (GitHub's own delivery limit), so the
    default (50) and larger values behave as 25 MiB and the 400 body says "under 25 MB"
    (upstream "under 50 MB"); values up to 25 behave as upstream, except for the 413 above
    the server's 64 MiB cap (REPO-114); GHCR uses the same limit.
    See docs/architecture/components/webhook.md#gaps-and-intentional-differences (item 13).

REPO-116:
  status: implemented
  impl: [internal/webhook/secrets.go, internal/webhook/providers.go, internal/webhook/handler.go]
  tests:
    - internal/webhook/handler_test.go:TestSCMProviderSecrets
    - internal/webhook/handler_test.go:TestProviderDeliveries
    - internal/webhook/envtest_test.go:TestEnvtestWebhookRefresh
    - internal/webhook/hardening_test.go:TestUnsignedPolicy
  notes: >-
    patrol-secret webhook keys plus SCMProvider webhook.secretRef secrets (several candidates
    for rotation, fail closed when unreadable, tenant namespaces untrusted by default).
    Settings are read per request, so rotation (Azure DevOps credentials included) needs no
    restart. While patrol-secret was never loaded deliveries are answered 503 unless an
    SCMProvider secret verifies them. Unsigned deliveries are accepted when no webhook
    secret is configured anywhere (upstream). Intentional difference: once any webhook
    secret is configured (any provider, patrol-secret or trusted SCMProvider), unsigned
    deliveries are rejected for every provider, because the provider route comes from
    request headers and the repository from the unsigned payload (a forged delivery through
    a provider without a secret would bypass another provider's secret);
    AllowUnsignedPerProvider restores upstream, RequireSignatures rejects all unsigned
    deliveries. See docs/architecture/components/webhook.md#secrets-repo-116-t9 and item 14
    of the differences.

