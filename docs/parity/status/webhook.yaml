REPO-127:
  status: implemented
  impl: [internal/webhook/process.go, internal/webhook/refresh.go]
  tests:
    - internal/webhook/process_test.go:TestMatchAppPush
    - internal/webhook/process_test.go:TestPushRefreshesApplications
    - internal/webhook/process_test.go:TestPatchRetries
    - internal/webhook/hardening_test.go:TestRefreshConditionalPatch
    - internal/webhook/envtest_test.go:TestEnvtestWebhookRefresh
    - internal/webhook/envtest_test.go:TestEnvtestRefreshConditionalPatch
  notes: >-
    Dry source among candidate sources; a dry-source match sets refresh and hydrate to
    normal, a sync-branch push refreshes only; merge patch with conflict retries (5 x 100 ms;
    429 and server timeouts also retried). Difference: the Application refresh patch carries
    the resourceVersion read through Config.APIReader (optimistic lock), so a hard
    refresh/hydrate requested or consumed between read and patch yields a real 409 and is
    re-decided (verified against envtest); upstream RefreshApp patches unconditionally.
    A persistently stale APIReader makes the refresh fail (counted as error) rather than
    overwrite a newer value.

