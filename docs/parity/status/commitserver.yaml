    Template data {metadata: <hydrator metadata as JSON map>}, Sprig generic functions minus
    env/expandenv/getHostByName, output capped at 1 MiB; execution errors fail the group
    ("failed to get hydrator commit templated message: ..."). Parse errors are rejected
    earlier by internal/settings (falls back to the default template).

APP-127:
  status: implemented
  impl: [internal/commitserver/metadata.go, internal/commitserver/write.go]
  tests:
