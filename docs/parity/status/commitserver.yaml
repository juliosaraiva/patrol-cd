APP-129:
  status: implemented
  impl: [internal/commitserver/metadata.go]
  tests:
    - internal/commitserver/service_test.go:TestCommitFileContents
    - internal/commitserver/metadata_test.go:TestRenderCommitMessage
  notes: >-
    Root hydrator.metadata carries author, date, subject, body (valid reference trailers
    removed with internal/git ParseReferences) and references from the dry commit metadata
    returned by the repo-server. Trailer parsing itself belongs to internal/git.

APP-135:
  status: implemented
  impl: [internal/commitserver/server.go, internal/commitserver/client.go, internal/commitserver/run.go, internal/commitserver/metrics.go]
  tests:
    - internal/commitserver/server_test.go:TestHTTPCommitRoundTrip
    - internal/commitserver/server_test.go:TestHTTPHandler
    - internal/commitserver/server_test.go:TestClientHandlesUnexpectedResponses
    - internal/commitserver/run_test.go:TestRun
    - internal/commitserver/service_test.go:TestCommitMetrics
  notes: >-
    JSON over HTTP with bearer token (ADR-0006) instead of gRPC; health at /healthz; ports
    8086/8087; metrics with the patrol_ prefix (no userinfo duration metric, which upstream
    never observes). Fresh temp dir per request. The patrolcd commit-server subcommand and
    its flags are not wired yet (cmd owner).
