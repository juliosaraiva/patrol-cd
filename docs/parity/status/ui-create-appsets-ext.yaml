API-122:
  status: implemented
  impl: [ui/src/extensions/slots.tsx, ui/src/app/routes.tsx, ui/src/shell/AppShell.tsx, ui/src/shell/nav.tsx]
  tests: [ui/src/extensions/slots.test.tsx, ui/src/shell/shell.test.tsx]
  notes: >-
    Sidebar items (sidebar and mobile drawer, after the built-in sections) via
    useSystemExtensionNavItems() and pages via <SystemExtensionRoutes> on the catch-all route
    (heading, document title and breadcrumb = extension title; nested paths under the extension
    path render it); built-in routes win over colliding paths and other unknown paths still 404.
    Registrations after the first render (late bundles) update the nav, page and breadcrumb.

API-123:
  status: implemented
  impl:
    - ui/src/extensions/slots.tsx
    - ui/src/pages/applications/details/ApplicationViews.tsx
    - ui/src/pages/applications/details/ResourceViewsSlot.tsx
  tests: [ui/src/extensions/slots.test.tsx, ui/src/pages/applications/details/ResourceViewsSlot.test.tsx]
  notes: >-
    useAppViewExtensions() (shouldDisplay applied) and <AppViewExtensions view=...>. With at least
    one extension view for the application, the details page renders one switcher (Tree, Pods,
    Network, List, then extension titles) bound to ?view= (built-in id or title, as upstream);
    the extension gets {application, tree} with the live resource tree. ?view= naming a hidden or
    unknown view falls back to the built-in default; the default-view annotation may name an
    extension. Icons are a generic glyph (no Font Awesome). The resource drawer (?node=) is not
    shown while an extension view is selected.

