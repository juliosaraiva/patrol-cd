# Web UI: application creation wizard, ApplicationSets pages, notifications catalog and
# subscription editor, help page, UI extensions host (workstream create-appsets-ext).
# See docs/architecture/components/ui.md ("UI extensions" and "Application creation,
# ApplicationSets, notifications and help").
# Evidence level: vitest + Testing Library against MSW mocks of the API contract. Nothing here has
# run against patrol-server or in a browser (Playwright journeys in
# ui/e2e/create-appsets-ext.spec.ts are written but not executed), so no entry is verified.
# Commands and results: docs/verification/log.md V-UICAE-01..04.
# Every mount requested from other workstreams has landed (ui.md, "Pending mounts"); the tests
# listed for API-111/120/122/123 render the mounted app (real routes, shell and pages).

API-091:
  status: implemented
  impl:
    - ui/src/pages/create/ApplicationCreateForm.tsx
    - ui/src/pages/create/SourceFields.tsx
    - ui/src/pages/create/ParametersFields.tsx
    - ui/src/pages/create/model.ts
    - ui/src/pages/create/CreateApplicationPanel.tsx
    - ui/src/api/hooks/create.ts
  tests:
    - ui/src/pages/create/ApplicationCreateForm.test.tsx
    - ui/src/pages/create/model.test.ts
  notes: >-
    Form and YAML modes over one draft (bidirectional, inline YAML errors), project picker,
    application namespace (apps in any namespace), sync policy (manual/automatic, prune, self
    heal, allow empty), sync options incl. Replace only when allowed, prune propagation, retry,
    deletion finalizer, registered-repository picker, branches/tags (refs), Helm chart and
    version pickers, OCI tags, path suggestions (repositories/{repo}/apps), source type and
    Helm/Kustomize/Directory/Plugin parameters from appdetails, multi-source with ref keys,
    source hydrator, destination by URL or name, upsert/validate, server error guidance,
    navigation to the new app. YAML that parses but has the wrong shape (missing repoURL,
    sourceHydrator: {}, a string where a list is expected, numeric revisions) yields a draft with
    empty fields or a line-specific error, never a render failure. Reached from the applications
    list ("New application", ?new=1), which mounts CreateApplicationPanel.

