NOTIF-109:
  status: implemented
  impl:
    - ui/src/pages/notifications/SubscriptionEditor.tsx
    - ui/src/pages/notifications/subscriptions.ts
    - ui/src/api/hooks/notifications.ts
  tests:
    - ui/src/pages/notifications/SubscriptionEditor.test.tsx
    - ui/src/pages/notifications/subscriptions.test.ts
  notes: >-
    Rows for subscribe.<trigger>.<service> annotations with trigger/service suggestions, free
    text when the catalog fails, recipient validation, JSON merge patch of changed keys only,
    read-only display without applications/update. Differs from upstream on purpose: names
    with digits, "_" and dotted services are editable (the engine accepts them), and a
    duplicate trigger/service pair is an error instead of silently replacing the other row.
    The application summary panel mounts the editor.

API-120:
  status: implemented
  impl: [ui/src/extensions/registry.ts, ui/src/extensions/loader.ts, ui/src/extensions/slots.tsx, ui/src/main.tsx]
  tests:
    - ui/src/extensions/registry.test.ts
    - ui/src/extensions/loader.test.ts
    - ui/src/extensions/slots.test.tsx
    - ui/src/main.test.tsx
  notes: >-
    window.extensionsAPI with the five registration functions, registration events (slots
    re-render), error boundaries, extensions.js loaded with a classic script tag (an empty
    script or a failed fetch of it means no extensions and logs nothing). main.tsx calls
    initExtensions() after the first render is scheduled, so the globals exist and extensions.js
    is requested at startup on every page (as upstream), not only when a slot renders.
    main.test.tsx runs the real bootstrap in jsdom (which does not execute the script).

