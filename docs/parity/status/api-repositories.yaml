REPO-027:
  status: implemented
  impl: [internal/apiserver/services/repositories/secrets.go]
  tests:
    - internal/apiserver/services/repositories/repositories_test.go:TestRepositoryLifecycle
    - internal/apiserver/services/repositories/repositories_test.go:TestListAndRecovery
    - internal/apiserver/services/repositories/consistency_test.go:TestCredentialsFollowObjectUpdate
  notes: >-
    Patrol form of the write/delete semantics: credentials live in a Secret managed by the API
    (secret-type label, managed-by annotation, ownerReference); unknown keys survive updates;
    a credentials field replaces the recognized keys, its absence keeps them; deleting removes
    the managed Secret only, a Secret the API does not manage is never modified (upstream
    strips its label). Malformed bool/int keys do not exist (typed CRD fields). On updates the
    object is written first and the Secret second; a Secret write failure restores the spec.

