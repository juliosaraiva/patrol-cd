  notes: >-
    The body is a Repository object plus credentials (every RepoAccessQuery field has a spec or
    credentials counterpart). Without credentials of its own, a proxy or insecure flag that
    differs from the inherited template's is refused (403) unless the caller may update the
    template (upstream sends the template's credentials with the request's proxy and flags).

