API-036:
  status: implemented
  impl: [internal/apiserver/services/repositories/repocreds.go, internal/apiserver/services/repositories/secrets.go, pkg/apiclient/repositories.go]
  tests:
    - internal/apiserver/services/repositories/repocreds_test.go:TestRepoCreds
    - internal/apiserver/services/repositories/repocreds_test.go:TestWriteRepoCreds
    - internal/apiserver/services/repositories/consistency_test.go:TestCredentialsFollowObjectUpdate
    - internal/apiserver/services/repositories/consistency_test.go:TestDeclarativeURLPasswordsMasked
  notes: >-
    Templates are RepositoryCredential objects with a managed credentials Secret; update and
    delete address the exact URL prefix; the write list returns every write template. The
    template is written before its Secret (a 409 changes no credential); a password in a
    declarative urlPrefix or proxy is masked in responses.

API-037:
  status: implemented
  impl: [internal/apiserver/services/repositories/repositories.go, internal/apiserver/services/repositories/secrets.go, internal/apiserver/services/repositories/validate.go, pkg/apiclient/repositories.go]
  tests:
    - internal/apiserver/services/repositories/repositories_test.go:TestRepositoryLifecycle
    - internal/apiserver/services/repositories/repositories_test.go:TestCreateUnreachable
    - internal/apiserver/services/repositories/repositories_test.go:TestProjectScopedRepositories
    - internal/apiserver/services/repositories/repositories_test.go:TestValidateAccess
    - internal/apiserver/services/repositories/repositories_test.go:TestAuthentication
    - internal/apiserver/services/repositories/repositories_test.go:TestInputValidation
    - internal/apiserver/services/repositories/inherit_test.go:TestInheritedTemplateTransport
    - internal/apiserver/services/repositories/consistency_test.go:TestDeclarativeURLPasswordsMasked
  notes: >-
    No deprecated alias routes (single REST surface). Responses are the Repository object plus
    hasCredentials/inheritedCredentials/connectionState instead of Argo's flat Repository; URL
    passwords of declaratively created objects are masked (upstream returns them). A
    repository that would inherit a template's credentials cannot set its own proxy or
    insecure flags unless the caller may update the template (upstream allows it).

