OPS-097:
  status: implemented
  impl: [internal/server/commands.go, internal/server/server.go, internal/server/tlsutil.go, internal/server/components.go]
  tests:
    - internal/server/runtime_test.go:TestTLSConfigs
    - internal/server/server_test.go:TestAPICipherSuites
    - internal/server/smoke_test.go:TestServerRunDefaultTLS
    - internal/server/smoke_test.go:TestRepoServerRunSmoke
  notes: >-
    server.tls.* and reposerver.tls.* (min/max version, TLS 1.2 ciphers, insecure suites
    refused) reach the listeners. patrol-server's listener offers HTTP/2: a TLS 1.2 list without
    an HTTP/2-required AES-128-GCM suite (the upstream default is one) gets
    TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256 and TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 appended
    (logged), otherwise net/http refused to serve and the default start exited 1; min 1.3
    ignores the list with upstream's warning. TestServerRunDefaultTLS runs server.Run with the
    compiled defaults against envtest: TLS 1.3 + HTTP/2 and TLS 1.2 handshakes succeed, a
    client offering only other suites is refused. Not covered here: the `list` value and the
    exact upstream startup messages.

