    performs real TLS handshakes against stub HTTPS servers (simulated Dex): plaintext,
    unverified default, pinned certificate accepted, same-CA other certificate rejected with
    "dex server certificate does not match", foreign CA rejected. In progress: no SSO login
    through a real Dex; the pinning lives in the wiring until core.DexTransport takes a pin
    (integration finding W-13).

