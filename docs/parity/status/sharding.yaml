# internal/controller/sharding (cluster → shard assignment, Lease-based shard ownership,
# predicates) and internal/controller/treeapi (controller internal tree/diff/live-object API
# and its shard-routing client). See docs/architecture/components/sharding.md and
# docs/architecture/components/treeapi.md (commands and results under "Verification").
# Library-level evidence: the controller binary, patrol-server and the CLI do not use the
# packages yet, so nothing is exercised through a running controller. envtest tests use a real
# kube-apiserver 1.36 (Leases, a StatefulSet object without a controller, the generated
# Cluster CRD); the tree API is tested over real HTTP with a fake StateProvider.

OPS-040:
  status: implemented
  impl:
    - internal/controller/sharding/config.go
    - internal/controller/sharding/lease.go
    - internal/controller/sharding/ownership.go
  tests:
    - internal/controller/sharding/config_test.go:TestConfigFromEnv
    - internal/controller/sharding/config_test.go:TestInferShard
    - internal/controller/sharding/config_test.go:TestPreferredShard
    - internal/controller/sharding/lease_test.go:TestLeaseManagerAcquiresAndRenewsPreferredShard
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerLateHeartbeatReportsLapse
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerAcquireErrorsFailHealthz
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerRenewErrors
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerHungCallIsBounded
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerSeesShardLeasesWithoutLabels
    - internal/controller/sharding/envtest_test.go:TestLeaseFailoverEnvtest
    - internal/controller/sharding/envtest_test.go:TestUnlabeledShardLeaseEnvtest
    - internal/controller/sharding/ownership_test.go:TestOwnershipPredicates
  notes: >-
    PATROL_CONTROLLER_REPLICAS / PATROL_CONTROLLER_SHARD / hostname ordinal with upstream
    parsing and warnings; one replica processes all clusters. Shards are owned through Leases
    patrol-controller-shard-<n> (ADR-0008) instead of trusting the ordinal alone. Difference: a
    preferred shard not lower than the replica count makes the replica a standby (upstream falls
    back to shard 0 when greater, and keeps a shard equal to the replica count); destinations
    that do not resolve are served by shard 0 (upstream: by every shard). Controller wiring
    (filtering informers and caches by OwnsApplication/OwnsCluster) is not done here.

