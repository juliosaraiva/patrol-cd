    - internal/controller/sharding/algorithm_test.go:TestRoundRobinReshuffle
    - internal/controller/sharding/assigner_test.go:TestAssignerRoundRobinRedistributesOnAdd
  notes: >-
    Rank in the clusters sorted by ID (ties by server) modulo replicas, in-cluster included
    (empty ID sorts first); 5 clusters over 2 replicas give 3/2; removing the first-ranked
    cluster reshuffles the others (baseline TestShuffle values).

OPS-043:
  status: implemented
  impl: [internal/controller/sharding/consistent.go, internal/controller/sharding/algorithm.go]
  tests:
    - internal/controller/sharding/algorithm_test.go:TestConsistentHashingDistributionAndScaleDown
    - internal/controller/sharding/algorithm_test.go:TestConsistentHashingBoundedLoadsProperty
    - internal/controller/sharding/algorithm_test.go:TestConsistentHashingAddingUnloadedClusterMovesNothing
    - internal/controller/sharding/algorithm_test.go:TestRingHashIsBLAKE2b512LittleEndian
    - internal/controller/sharding/algorithm_test.go:TestRingVirtualNodeCollisionsFollowInsertionOrder
    - internal/controller/sharding/consistent_test.go:TestConsistentHashingMatchesNaiveRing
    - internal/controller/sharding/assigner_test.go:TestAssignerConsistentHashingUsesApplications
  notes: >-
    Re-implemented ring with the baseline's parameters (members "0".."N-1", 1000 virtual nodes
    "<member><i>", BLAKE2b-512 first 8 bytes little endian, later member wins a colliding
    virtual node, successor strictly after the key, bound ceil(floor((T+1)/N)*1.25)), loads =
    Applications per spec.destination.server. Parity is argued from the algorithm and a
    differential test against an independent mirror of the baseline's structure; no upstream
    golden assignment exists to compare with. Differences: Application destinations are
    normalized (trailing "/"), Applications are keyed by namespace/name (upstream: name), and a
    destination change recomputes loads (upstream waits for another trigger).

OPS-044:
  status: implemented
  impl: [internal/controller/sharding/algorithm.go, internal/controller/sharding/assigner.go]
  tests:
    - internal/controller/sharding/algorithm_test.go:TestDistribute
    - internal/controller/sharding/assigner_test.go:TestAssignerLegacy
    - internal/controller/sharding/envtest_test.go:TestAssignedShardWriterEnvtest
  notes: >-
    Cluster.spec.shard lower than the replica count pins the cluster for every algorithm. A
    higher value logs "Specified cluster shard (n) for cluster: <server> is greater than the
    number of available shard (r). Using shard 0." and uses shard 0, which is what the
    baseline's runtime path (ClusterSharding.updateDistribution) does; the "Assigning
    automatically" wording of the inventory comes from GetClusterFilter, which the baseline
    controller does not call. Cluster.status.assignedShard is written by the owner of the shard.

OPS-045:
  status: implemented
  impl:
    - internal/controller/sharding/lease.go
    - internal/controller/sharding/replicas.go
    - internal/controller/sharding/assigner.go
  tests:
    - internal/controller/sharding/envtest_test.go:TestDynamicDistributionEnvtest
    - internal/controller/sharding/envtest_test.go:TestDynamicDistributionWaitsForReplicaCountEnvtest
    - internal/controller/sharding/envtest_test.go:TestLeaseFailoverEnvtest
    - internal/controller/sharding/lease_test.go:TestLeaseManagerFailoverAndHandoff
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerFirstReplicaReadFailureClaimsNothing
    - internal/controller/sharding/lease_failure_test.go:TestLeaseManagerFailedHandoffReleaseIsNotUndone
    - internal/controller/sharding/lease_test.go:TestLeaseManagerReplicaCountChanges
    - internal/controller/sharding/lease_test.go:TestWorkloadReplicas
    - internal/controller/sharding/config_test.go:TestConfigFromEnv
  notes: >-
    PATROL_ENABLE_DYNAMIC_CLUSTER_DISTRIBUTION reads spec.replicas of the controller
    StatefulSet (or a Deployment) named PATROL_APPLICATION_CONTROLLER_NAME every heartbeat;
    changes rebalance clusters and Leases without restarts. The shard-mapping ConfigMap is
    replaced by per-shard Leases by design (ADR-0008): renewal every
    PATROL_CONTROLLER_HEARTBEAT_TIME (10..60s, default 10s) is the heartbeat, expiry after
    3 heartbeats is the takeover rule, with handoff back to the preferred replica. Readiness
    errors keep upstream's messages with "statefulset" for the kind. Difference: when the
    replica count cannot be read before one is known, upstream exits at startup; Patrol keeps
    running, claims no shard and fails readiness until the read succeeds.

OPS-053:
  status: different-by-design
  notes: >-
    No Redis (ADR-0004): resource trees live in controller memory and are served on demand by
    the controller tree API (docs/architecture/components/treeapi.md), so there is nothing to
    split into keys and PATROL_APPLICATION_TREE_SHARD_SIZE does not exist.

