    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:marks Secrets as masked and does not offer editing
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:hides editing and logs without permission
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:offers editing with only the fine-grained update permission the server checks
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:warns when only the application-wide update permission is granted
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:names the fine-grained permission when the server refuses the patch
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:lists events with a warning count in the tab
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:runs a resource action after confirmation and reports the result
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:sends parameters of a parameterized action
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:deletes a resource with the chosen propagation after typing its name
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:offers the terminal for pods only when exec is enabled and permitted
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:explains missing resources and unknown deep links
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:closes with Escape and clears the deep link
  notes: >-
    Deep links `node=<group/kind/namespace/name>` and `tab=`. Summary (fields, health message,
    sync, wave, hook, pruning, owner chain, images, info items, labels, annotations, links from
    ListResourceLinks limited to http(s)); Live manifest (hide managed fields, wrap, edit as YAML
    applied as an RFC 7386 merge patch after a diff review; Secrets flagged as masked and not
    editable; Edit is offered from can-i on the fine-grained action the server enforces,
    `applications, update/<group>/<kind>/<namespace>/<name>` (sent as one encoded path segment),
    with a warning when only plain `update` is granted, which counts only when
    server.rbac.disableApplicationFineGrainedRBACInheritance is "false", and a 403 on apply names
    the permission); Desired manifest; Diff; Events with a
    warning badge; Logs (can-i logs get); Terminal (exec.enabled and can-i exec create); Actions
    (parameterized by name, as upstream discovery declares no defaults; confirmed); Delete (foreground, force, orphan; typed confirmation); optional
    selective Sync through the slot's onSyncResources. Extension tabs are API-121; the
    ApplicationSet PREVIEW tab does not apply to applications.

