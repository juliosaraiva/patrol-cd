  tests:
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:shows a loading state, then the tree with the application root and managed resources
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:switches views with the keyboard and keeps the view in the URL
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:honors the default-view annotation and the view URL parameter
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:filters from URL parameters and clears them
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:filters by name with wildcards, sync status (hooks always shown) and health from the menus
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:shows orphaned resources only when the toggle is on
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:hides the orphaned toggle when the project does not monitor orphaned resources
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:navigates the graph with the keyboard and opens details with Enter
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:collapses and expands a node with the arrow keys
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:renders the accessible outline with the same items
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:groups pods by node with node resources, and by parent resource
    - ui/src/pages/applications/resources/ResourceViews.test.tsx:draws the network and lists external endpoints with safe links
    - ui/src/pages/applications/resources/graph/GraphCanvas.test.tsx:renders only the nodes near the viewport of a graph with thousands of nodes
    - ui/src/pages/applications/resources/graph/GraphCanvas.test.tsx:zooms with buttons and keys, resets and fits
    - ui/src/pages/applications/resources/model/model.test.ts:groups many same-kind leaves, pages wide parents and counts collapsed descendants
    - ui/src/pages/applications/resources/model/model.test.ts:lays out thousands of nodes quickly
    - ui/src/pages/applications/resources/model/model.test.ts:matches wildcard edge cases like an anchored glob
    - ui/src/pages/applications/resources/model/model.test.ts:matches pathological wildcard patterns from a shared link in linear-ish time
  notes: >-
    Tree (layered left-to-right SVG graph with Patrol's own layout: longest-path layering,
    tidy rows, bus edge routing; viewport culling, level of detail, zoom/pan by pointer, wheel
    and keyboard, fit to screen, zoom persisted), Pods (by node with host resources and
    propagated node labels, by parent, by top-level resource; `podSortMode` param and
    `pref.cd.patrol.example/default-pod-sort`), Network and List views; `view` param and
    `pref.cd.patrol.example/default-view`. Filters in URL params (`name` with wildcards, `kind`,
    `sync` where OutOfSync includes Unknown and hooks ignore the sync filter, `health`,
    `namespace`, `orphaned` offered when the project monitors orphaned resources, `hooks`).
    Group similar nodes, "show N more" per parent, collapse/expand, and an ARIA tree outline.
    The tree is live through the resource-tree SSE stream. App View extensions are API-123.
    The health filter applies to each node (not to the application root). The `name` wildcard
    filter is a two-pointer glob matcher (O(name x pattern)), not a RegExp, so a crafted link
    cannot stall the page.

