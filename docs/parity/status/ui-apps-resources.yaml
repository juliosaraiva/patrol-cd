# Web UI, application resource views (ui/src/pages/applications/resources/): tree, pods, network
# and list views, resource filters, the resource details drawer (summary, live/desired manifest,
# diff, events, logs, terminal, actions, delete) and the app-level diff panel. Mounted by the
# details page through ui/src/pages/applications/resources/contract.ts. Evidence is vitest +
# Testing Library against MSW mocks of the /api/v1 contract (pnpm -C ui test): implemented, not
# verified end to end. Playwright journeys for a real server live in ui/e2e/apps-resources.spec.ts
# and have not been run. Kind icons are Patrol's own drawings (no upstream assets).

