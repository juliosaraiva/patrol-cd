API-097:
  status: implemented
  impl: [ui/src/pages/applications/resources/details/TerminalPanel.tsx]
  tests:
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:connects to the terminal WebSocket, relays stdout and stdin and resizes
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:reconnects with the chosen container and shell
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:reconnects when the server asks for it
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:ignores a forbidden close of a replaced socket that arrives after the new one opened
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:does not report the closed socket after unmounting
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:shows the forbidden and disconnected states with recovery guidance
    - ui/src/pages/applications/resources/details/TerminalPanel.test.tsx:keeps Escape in the shell and leaves with Shift+Escape
    - ui/src/pages/applications/resources/details/ResourceDetailsDrawer.test.tsx:offers the terminal for pods only when exec is enabled and permitted
  notes: >-
    xterm.js 6 (lazy chunk) over /terminal: stdin/resize/stdout TerminalMessage frames, reconnect
    on a server Code message (the replaced socket's handlers are detached before it closes, so
    its late close event cannot mark the new session disconnected), container and shell
    pickers, forbidden (close 1008/4003 or a
    permission reason) and disconnected states, screen reader mode, Shift+Escape leaves the
    terminal. Tests use a fake WebSocket and a mocked xterm. xterm's DOM renderer injects style
    elements, which a `style-src 'self'` CSP without a nonce would block; not checked against the
    server's headers.

