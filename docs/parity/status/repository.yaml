    - internal/repository/azure_test.go:TestAzureServicePrincipalCacheCap
    - internal/repository/resolve_test.go:TestResolveErrors
    - internal/repository/security_test.go:TestTokenEndpointPolicy
  notes: Client secret credential against a fake Entra ID with a custom endpoint (instance discovery disabled; the endpoint must be https on a Microsoft cloud authority or Options.AzureAuthorityHosts, by design; error bodies are not reflected), cache duration capped at 59 minutes (Options field; process flag/env wiring pending). IDs without a client secret are a configuration error rather than anonymous access (by design); the repo-creds key casing difference does not apply to typed CRD fields.
