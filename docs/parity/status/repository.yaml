# internal/repository — repository access resolution (lookup precedence, credential templates,
# credential method selection, short-lived token minting, Helm dependency lists, connection
# testing and status). Library-level evidence: `go test -race ./internal/repository/` with
# KUBEBUILDER_ASSETS set (envtest API server for the lister and the status subresource; fake
# GitHub, Google, Entra ID and ACR endpoints over httptest). Nothing here is wired into the
# controller, the API server or the hydrator yet, so no feature is "verified". Features whose
# end-to-end behavior also needs the repo-server transports or the API are "in-progress".

REPO-001:
  status: in-progress
  impl: [internal/repository/lister.go]
  tests:
    - internal/repository/envtest_test.go:TestEnvtestResolveAndValidate
    - internal/repository/resolve_test.go:TestResolveErrors
    - internal/repository/security_test.go:TestSecretReferencesAreChecked
  notes: Declarative Repository objects and labeled Secrets are picked up by informers without a restart; unlabeled Secrets and other secret types are invisible; late labeling, rotation and deletion are observed (envtest). A referenced Secret must carry the secret-type of the referencing kind and purpose (repository/repository-write, repo-creds/repo-write-creds, scm-creds). Listing through the API is not in this package.
