REPO-015:
  status: implemented
  impl: [internal/repository/github.go, internal/repository/material.go, internal/repository/tokens.go]
  tests:
    - internal/repository/github_test.go:TestGitHubAppTokenCaching
    - internal/repository/github_test.go:TestGitHubAppConcurrentMint
    - internal/repository/github_test.go:TestGitHubAppFromSCMProvider
    - internal/repository/github_test.go:TestGitHubAppFailures
    - internal/repository/provider_test.go:TestGitHubAppProxy
    - internal/repository/security_test.go:TestSCMProviderCannotRedirectCredentials
    - internal/repository/security_test.go:TestTokenEndpointPolicy
  notes: Installation tokens minted through the pkg/scm/github CredentialSource (fake GitHub API over TLS), x-access-token user, cached until five minutes before expiry and refreshed, CredentialsExpireAt set; the private key never leaves the resolver. An App ID without a key is a configuration error (see docs/architecture/components/repository.md). The App may also come from an SCMProvider, whose API URL, CA and TLS setting are then always used; an inherited template key keeps the template's endpoint. Error messages keep only the HTTP status (no response body).
