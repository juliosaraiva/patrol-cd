    - internal/repository/envtest_test.go:TestEnvtestResolveAndValidate
  notes: Type selection (CRD default git, query hint, oci:// inference), per-type settings and credentials, Helm lists require a name. API normalization and validate-access errors for unknown types are the API server's (the CRD enum rejects unknown types).
