    - internal/repository/resolve_test.go:TestInheritanceRules
    - internal/repository/security_test.go:TestTokenEndpointPolicy
  notes: cloud-platform scope, client_email user name, token cached until shortly before expiry (fake token endpoint). external_account credentials are rejected, and token_uri / impersonation URLs must be https on Google's hosts or Options.GoogleTokenHosts, by design (see docs/architecture/components/repository.md); token endpoint error bodies are not reflected.
REPO-019:
  status: implemented
  impl: [internal/repository/azure.go]
  tests:
    - internal/repository/azure_test.go:TestAzureWorkloadIdentityGit
    - internal/repository/azure_test.go:TestAzureWorkloadIdentityACR
    - internal/repository/azure_test.go:TestAzureWorkloadIdentityACRChallengeErrors
    - internal/repository/security_test.go:TestAzureWorkloadIdentityHostPolicy
  notes: Git (Azure DevOps scope, empty GUID user, token as password and bearer token) and Helm ACR challenge/exchange with AZURE_ARM_TOKEN_RESOURCE, against a fake token provider and a fake registry. By design (the token is the controller/API server identity) the ACR exchange runs only for Options.AzureContainerRegistryHosts (default *.azurecr.io/.cn/.us) with verified TLS and a realm on the registry host, and the Azure DevOps token goes only to https Options.AzureDevOpsHosts (default dev.azure.com, *.visualstudio.com). The bearer header itself is sent by internal/git.
