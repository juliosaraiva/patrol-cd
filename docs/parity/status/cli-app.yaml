# `patrol app` and `patrol appset` command groups (internal/cli/app). See
# docs/architecture/components/cli-app.md.
# Evidence: unit tests of the package and end-to-end tests that run the real CLI root command
# (internal/cli/clitest) against the real patrol API server with the applications and
# applicationsets services, real auth (login session tokens) and RBAC, the real controller
# tree API handler and client, and an envtest kube-apiserver 1.36 with the generated CRDs. The
# repo-server is an in-process fake and a controller stand-in compares and applies manifests
# (no real controller or sync engine). Nothing is "verified" yet: the group is not registered
# in cmd/patrol (request to cli-core), the API services are not wired into patrol-server, and
# operations run against the stand-in.

API-063:
  status: implemented
  impl:
    - internal/cli/app/app.go
    - internal/cli/app/create.go
    - internal/cli/app/get.go
    - internal/cli/app/list.go
    - internal/cli/app/set.go
    - internal/cli/app/unset.go
    - internal/cli/app/edit.go
    - internal/cli/app/delete.go
