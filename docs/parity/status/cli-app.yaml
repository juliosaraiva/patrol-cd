APP-138:
  status: implemented
  impl: [internal/cli/app/appopts.go, internal/cli/app/specmut.go, internal/cli/app/unset.go]
  tests:
    - internal/cli/app/e2e_test.go:TestE2EAppHydratorFlags
    - internal/cli/app/appopts_test.go:TestSpecMapperHydratorFlags
    - internal/cli/app/appopts_test.go:TestSpecMapperHydratorSourceOptions
    - internal/cli/app/appopts_test.go:TestSetParameterOverrides
    - internal/cli/app/units_test.go:TestSetUnsetSourceHydratorApp
  notes: >-
    Hydrator flags as upstream. Difference: upstream ignores plain source flags next to
    hydrator flags, and on an existing hydrator Application it edits a detached copy, so the
    change is lost while the command succeeds. Patrol stores tool options and -p in
    spec.sourceHydrator.drySource (set, unset, create -f FILE). It rejects --repo, --path,
    --revision, --helm-chart, --tag-prefix, --ref, --source-name and --source-position > 0
    with exit 20 and sends no change. See docs/architecture/components/cli-app.md.

