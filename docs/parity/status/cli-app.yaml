    - internal/cli/app/wait.go
    - internal/cli/app/ops.go
    - internal/cli/app/diff.go
    - internal/cli/app/manifests.go
    - internal/cli/app/resources.go
    - internal/cli/app/logs.go
    - internal/cli/app/sources.go
  tests:
    - internal/cli/app/e2e_test.go:TestE2EAppLifecycle
    - internal/cli/app/e2e_test.go:TestE2EAppResourceCommands
    - internal/cli/app/e2e_test.go:TestE2EAppLocal
    - internal/cli/app/e2e_test.go:TestE2EAppSyncFlags
    - internal/cli/app/e2e_test.go:TestE2EAppAuthorization
    - internal/cli/app/e2e_test.go:TestE2EAppCreateFromFiles
    - internal/cli/app/e2e_test.go:TestE2EAppResourceHealthFromTree
    - internal/cli/app/units_test.go:TestLogsCommand
  notes: >-
    Every subcommand with the upstream flags, messages and exit codes. Patrol additions:
    create --apply-spec-patch, sync/manifests --server-side-generate and --local-include,
    rollback --dry-run. Sync and wait follow Operation objects (ADR-0011); --resource
    selectors (wildcards, exclusions) are expanded on the client. The default diff output is
    diff(1)'s normal format computed in-process. logs is unit-tested only (envtest has no
    kubelet). Client-side --local rendering refuses plugin and Helm chart repository sources;
    Jsonnet needs jsonnet.MaybeJsonnetMain in cmd/patrol (requested).

