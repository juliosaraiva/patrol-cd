# CLI core (cmd/patrol, internal/cli and its cmdutil, config, transport, sso, output and
# clitest packages). See docs/architecture/components/cli.md.
# Evidence: end-to-end tests run the real cobra root command in-process (internal/cli/clitest)
# against the real patrol API server (internal/apiserver with the core routes and the
# projects, clusters and repositories services), the real token service, login
# authenticator, RBAC enforcer and settings manager, and an envtest kube-apiserver 1.36 with
# the generated CRDs. Fakes, where a feature depends on them, are named in the notes and the
# status is then verified-simulated: repo-server (connection tests), OIDC provider (SSO),
# destination cluster authentication (envtest behind a token-checking front end) and the
# Kubernetes port-forward subresource (no kubelet in envtest).

API-051:
  status: verified
  impl: [internal/cli/cmdutil/flags.go, internal/cli/cmdutil/opts.go, internal/cli/cmdutil/client.go, internal/cli/root.go]
  tests:
    - internal/cli/session_test.go:TestServerAndTokenSources
    - internal/cli/root_test.go:TestInvalidInvocations
    - internal/cli/root_test.go:TestHelpGolden
    - internal/cli/cmdutil/cmdutil_test.go:TestParseOpts
  notes: >-
    PATROL_OPTS (shell-quoted, --flag=value form, "PATROL_OPTS invalid at '<x>'"), PATROL_SERVER,
    PATROL_AUTH_TOKEN, PATROL_SERVER_NAME, PATROL_APPLICATION_CONTROLLER_NAME,
    PATROL_REPO_SERVER_NAME; precedence flag > PATROL_OPTS > environment > configuration.
    ARGOCD_OPTS/ARGOCD_SERVER/ARGOCD_AUTH_TOKEN are warned migration aliases (ARGOCD_OPTS
    --auth-token dropped; ARGOCD_AUTH_TOKEN only sent to ARGOCD_SERVER). --argocd-context is a
    hidden alias of --patrol-context; --redis-* accepted and deprecated (ADR-0004).

API-052:
  status: verified
  impl: [internal/cli/config/config.go, internal/cli/config/perm_unix.go, internal/cli/cmdutil/client.go]
  tests:
    - internal/cli/session_test.go:TestLoginContextsLogout
    - internal/cli/session_test.go:TestServerAndTokenSources
    - internal/cli/session_test.go:TestSSOLoginAndRefresh
    - internal/cli/config/config_test.go:TestWriteReadRoundTrip
    - internal/cli/config/config_test.go:TestReadErrors
    - internal/cli/config/config_test.go:TestContextOperations
    - internal/cli/config/config_test.go:TestDefaultPath
    - internal/cli/cmdutil/target_test.go:TestResolveTargetScopesContextCredentials
  notes: >-
    ~/.config/patrol/config (PATROL_CONFIG, PATROL_CONFIG_DIR, XDG_CONFIG_HOME), upstream YAML
    keys, atomic 0600 writes, 0600/0400 enforced on read. Context credentials and TLS data
    apply only to the context's own server (hardening): a requested --port-forward /
    --port-forward-namespace or --core is its own effective server and reuses only a
    port-forward / core context (no token, refresh token, SSO refresh or renewed-token
    storage for a remote context). The expired-SSO refresh path is
    exercised against a fake OIDC provider. ARGOCD_CONFIG_DIR and ~/.argocd are not read.

API-053:
  status: verified
  impl: [internal/cli/cmdutil/client.go, internal/cli/cmdutil/debuglog.go, internal/cli/transport/transport.go]
  tests:
    - internal/cli/transport_test.go:TestRootPath
    - internal/cli/transport_test.go:TestHTTPRetriesAndHeaders
    - internal/cli/session_test.go:TestLoginTLS
    - internal/cli/root_test.go:TestInvalidInvocations
    - internal/cli/cmdutil/cmdutil_test.go:TestDebugTransportRedacts
  notes: >-
    Transport is JSON over HTTP (ADR-0005): no gRPC probe or gRPC-Web fallback; --grpc-web is
    accepted and ignored, --grpc-web-root-path is the server root path. TLS by default,
    --plaintext, --insecure, --server-crt, client certificates, -H headers, User-Agent
    patrol-cli/<version>, --http-retry-max (502/503/504 and transport errors on GET).

