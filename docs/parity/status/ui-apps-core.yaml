# Web UI, applications core (ui/src/pages/applications, except resources/): list, details shell,
# sync, operations, history and rollback, delete, details/parameters. See
# docs/architecture/components/ui.md. Evidence is vitest + Testing Library against MSW mocks of
# the /api/v1 contract (pnpm -C ui test): implemented, not verified end to end. Playwright
# journeys for a real server live in ui/e2e/apps-core.spec.ts and have not been run.
# Annotation keys use Patrol's prefixes (notice.cd.patrol.example/*, link.cd.patrol.example/*,
# cd.patrol.example/managed-by-url, cd.patrol.example/deletion-approved).

