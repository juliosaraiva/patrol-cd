API-094:
  status: in-progress
  impl:
    - ui/src/pages/applications/parameters/AppDetailsPanel.tsx
    - ui/src/pages/applications/parameters/SourceEditor.tsx
    - ui/src/pages/applications/parameters/Fields.tsx
    - ui/src/pages/applications/parameters/specEdit.ts
    - ui/src/pages/applications/parameters/rebase.ts
    - ui/src/api/hooks/apps-core.ts
  tests:
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:edits labels and the sync policy, then saves with the loaded resourceVersion
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:merges the draft onto the latest version after a conflict, keeping concurrent changes
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:saves onto a status-only update without a conflict or a stale warning
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:holds the save until server-side edits are merged and reviewed
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:edits Helm parameters with override markers on a multi-source application
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:edits Kustomize images and validates patches YAML
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:adds Kustomize common labels and annotations, keeping a row while its key is retyped
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:adds entries to a map parameter announced by the plugin
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:renders plugin parameters from the announcement
    - ui/src/pages/applications/parameters/AppDetailsPanel.test.tsx:validates the YAML and saves the edited spec
    - ui/src/pages/applications/details/Integrations.test.tsx:adds Application resource-tab extensions and the notification subscriptions editor to the details panel
    - ui/src/pages/applications/parameters/specEdit.test.ts:applies drafts with parsed YAML and switches between single and multi source
    - ui/src/pages/applications/parameters/specEdit.test.ts:keeps rows without a key in the draft and writes only complete rows
    - ui/src/pages/applications/parameters/specEdit.test.ts:round-trips plugin map parameters in place and drops emptied ones
    - ui/src/pages/applications/parameters/rebase.test.ts:applies the user's edits onto the latest version and keeps concurrent changes
    - ui/src/pages/applications/parameters/rebase.test.ts:keeps the user's value when both sides changed a field and reports the conflict
    - ui/src/pages/applications/parameters/rebase.test.ts:merges lists of named items per name and removes what either side deleted
    - ui/src/pages/applications/parameters/rebase.test.ts:ignores status and resourceVersion updates from the controller
  notes: >-
    Summary (project, labels, annotations, destination, sync policy, sync options, retry, info,
    revision history limit, links, status badge), Parameters/Sources (Helm, Kustomize, Directory,
    Plugin editors, add/remove sources with refs) and Manifest (YAML of metadata and spec,
    validated) tabs, plus Application resource-tab extensions. Saves PUT the whole object: the
    user's changes (draft vs. the version it is based on) are applied onto the latest watched
    version, so status-only updates do not conflict; when labels, annotations, finalizers or the
    spec changed on the server, saving is held and the changed paths are listed until the user
    rebases (3-way merge: untouched fields take server values, both-changed fields keep the
    user's value and are listed as conflicts), and a 409 offers the same rebase. The summary mounts the notification subscriptions
    editor (NOTIF-109, src/pages/notifications). The manifest is saved with PUT, not UpdateSpec.
    Missing: the app EVENTS tab; the diff is a separate drawer.

API-098:
  status: implemented
  impl: [ui/src/pages/applications/sync/SyncPanel.tsx, ui/src/pages/applications/sync/SyncOptionsFields.tsx, ui/src/pages/applications/sync/syncOptions.ts]
  tests:
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:starts a full sync and links to the created operation
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:sends a revision override, apply-only strategy, retry and a selective resource list
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:lists every source revision of a multi-source app, excludes hooks and confirms pruning
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:requires confirming Force, and explains deletion approval for Prune=confirm
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:offers Replace only when the server allows it, with a typed confirmation
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:preselects one resource from the upstream deploy deep link
    - ui/src/pages/applications/sync/SyncPanel.test.tsx:explains a sync refused by a sync window
    - ui/src/pages/applications/sync/syncOptions.test.ts:sends every revision of a multi-source application when one changes
    - ui/src/pages/applications/sync/syncOptions.test.ts:sends empty sync options when the user clears the options the application declares
  notes: >-
    Revisions are sent only when they differ from the spec. Typed confirmation ('prune') whenever
    pruning deletes resources (upstream asks for both prune-all and prune-some), 'replace' for
    Replace, a checkbox for Force. FailOnSharedResource is offered as an option too. The body is
    the published ApplicationSyncRequest (strategy, syncOptions {items}); the response
    ({application, operation}) names the created Operation.

