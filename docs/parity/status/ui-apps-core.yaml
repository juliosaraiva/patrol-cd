API-090:
  status: implemented
  impl: [ui/src/pages/applications/list/BulkActions.tsx, ui/src/pages/applications/ApplicationsListPage.tsx]
  tests:
    - ui/src/pages/applications/ApplicationsListPage.test.tsx:hard-refreshes the selected applications and reports each result
    - ui/src/pages/applications/ApplicationsListPage.test.tsx:syncs every selected application with the chosen flags
