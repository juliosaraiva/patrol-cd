    - internal/project/envtest_test.go:TestEnvtestScopedResourcesAreExact
  notes: Destinations from scoped clusters; the <project>/<server> RBAC object is not in this package. Deliberate security difference - the server and namespaces of a scoped cluster are escaped literals (upstream appends them as patterns, so a scoped server "https://*" opens every cluster; IPv6 servers such as https://[fd00::1]:6443 never matched themselves upstream).
