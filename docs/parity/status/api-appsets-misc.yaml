# internal/apiserver/services/{applicationsets,notifications,badge,extensions} and their
# pkg/apiclient types/methods. See docs/architecture/components/api-appsets-misc.md.
# Evidence: HTTP tests through pkg/apiclient against the real rest route chain with the real
# auth.TokenService, rbac.Enforcer and settings snapshots, and (ApplicationSets, badge,
# extensions) an envtest kube-apiserver with the Patrol CRDs; extension backends are local
# httptest servers. The services are not wired into cmd/patrolcd yet, so nothing is "verified".
# Commands and results: docs/verification/runs/2026-10-16-api-appsets-misc.txt.

ASET-100:
  status: implemented
  impl: [internal/apiserver/services/applicationsets/handlers.go, internal/apiserver/services/applicationsets/watch.go]
  tests:
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestCreateValidation
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestGetNoExistenceOracle
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestListFiltering
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestWatchPerEventAuthorization
    - internal/apiserver/services/applicationsets/internal_test.go:TestNamespaceEnabled
  notes: >-
    API side. The enabled namespaces are Config.Namespaces (names, globs, /regexp/), which the
    server wiring fills from applicationsetcontroller.namespaces (upstream argocd-server uses
    application.namespaces). Get, create, generate, tree, events and delete answer 403
    "namespace '<ns>' is not permitted"; list and watch filter. Delete also checks the namespace
    (upstream does not). Creation outside the control-plane namespace also requires every
    project to list the namespace in sourceNamespaces.

ASET-108:
  status: implemented
  impl: [internal/apiserver/services/applicationsets/handlers.go]
  tests:
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestCreateValidation
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestCreateAuthorization
    - internal/apiserver/services/applicationsets/limits_projects_test.go:TestActionsOnExistingNeedEveryProject
    - internal/apiserver/services/applicationsets/generator_internal_test.go:TestRBACObjects
  notes: >-
    API side: templated projects (spec.template and generator-level templates) are rejected for
    create, dry-run and generate; create is authorized on every project of internal/appset
    Projects, so a generator template cannot escalate into another project. Get, list, watch,
    tree, events, upsert and delete of an existing ApplicationSet are authorized on every
    project of appset.Projects as well (a templated project on a kubectl-created object maps
    to the wildcard project "*", fail closed); upstream checks the template project only.

