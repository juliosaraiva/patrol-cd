API-049:
  status: implemented
  impl: [internal/apiserver/services/extensions/proxy.go, internal/apiserver/services/extensions/registry.go, internal/apiserver/services/extensions/metrics.go, pkg/apiclient/extensions.go]
  tests:
    - internal/apiserver/services/extensions/extensions_test.go:TestProxyForwardsWithHeaderContract
    - internal/apiserver/services/extensions/extensions_test.go:TestProxyGoClientAndSSOIdentity
    - internal/apiserver/services/extensions/extensions_test.go:TestProxyRoutesByDestination
    - internal/apiserver/services/extensions/extensions_test.go:TestProxyLimitsAndFailures
    - internal/apiserver/services/extensions/extensions_test.go:TestProxyWebSocket
    - pkg/apiclient/appsetsmisc_client_test.go:TestInvokeExtensionClient
  notes: >-
    Outgoing headers Patrol-Namespace, Patrol-Target-Cluster-Name/URL, Patrol-User-Id,
    Patrol-Username, Patrol-User-Groups. Stricter than upstream: only allow-listed request headers
    are forwarded (upstream forwards all but Authorization and Cookie), Set-Cookie is removed from
    responses, bodies are capped, the whole exchange has a timeout, WebSocket upgrades are off by
    default; a destination is also matched through its resolved cluster's name or server.
    Metrics patrol_server_extension_requests_total and
    patrol_server_extension_request_duration_seconds.
