ASET-112:
  status: implemented
  impl: [internal/apiserver/services/applicationsets/handlers.go]
  tests:
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestUpsertAndIdempotentCreate
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestUpsertProjectChange
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestDryRunAndGenerate
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestCreateValidation
  notes: >-
    A metadata.resourceVersion in the body makes the upsert conditional (409 on conflict);
    without it conflicts are retried (10). The controller's applicationset-finalizer survives
    an upsert. No informer wait (reads are not served from a server-side cache here).

ASET-113:
  status: implemented
  impl: [internal/apiserver/services/applicationsets/handlers.go]
  tests:
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestDeletePropagation
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestCreateGetListDelete
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestGetNoExistenceOracle
    - internal/apiserver/services/applicationsets/limits_projects_test.go:TestActionsOnExistingNeedEveryProject
  notes: >-
    Delete needs delete on every project the ApplicationSet generates into. Patrol additions: cascade=false (orphan) and propagationPolicy=foreground|background, UID
    precondition. Missing ApplicationSets answer 403 like forbidden ones (upstream NotFound).
    No garbage collector in envtest: propagation is verified by the finalizer the API server
    sets, not by cascading Application deletion.

ASET-114:
  status: implemented
  impl: [internal/apiserver/services/applicationsets/handlers.go, internal/apiserver/services/applicationsets/generator.go]
  tests:
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestDryRunAndGenerate
    - internal/apiserver/services/applicationsets/applicationsets_test.go:TestGenerateBounds
    - internal/apiserver/services/applicationsets/limits_projects_test.go:TestGenerateBoundsRealGenerator
    - internal/apiserver/services/applicationsets/generator_internal_test.go:TestBoundedGeneratorMatchesAppset
    - internal/apiserver/services/applicationsets/generator_internal_test.go:TestBoundedGeneratorStopsAtApplicationLimit
    - internal/apiserver/services/applicationsets/generator_internal_test.go:TestBoundedGeneratorHonorsDeadline
    - internal/apiserver/services/applicationsets/generator_internal_test.go:TestBoundedGeneratorLimits
  notes: >-
    Bounded while generating (applicationsets.BoundedGenerator over internal/appset generators
    and templates): the deadline (504) is checked before every generator call and every
    rendered Application; the total parameter sets of all generator entries, the Applications
    and their JSON bytes are capped as they are produced (400), and Matrix products are capped
    as they are built. Equivalence with appset.NewAPIGenerator is tested on List, Matrix, Merge,
    selectors, generator templates, goTemplate and templatePatch; only the List, Matrix and
    Merge generators are exercised here, the others are internal/appset's.

