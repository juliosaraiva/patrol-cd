API-104:
  status: implemented
  impl:
    - ui/src/pages/settings/clusters/ClustersPage.tsx
    - ui/src/pages/settings/clusters/ClusterDetailsPage.tsx
    - ui/src/pages/settings/clusters/clusterUtil.ts
  tests:
    - ui/src/pages/settings/clusters/Clusters.test.tsx:edits name, namespaces and labels sending only the changed fields
    - ui/src/pages/settings/clusters/Clusters.test.tsx:invalidates the cache and rotates credentials with a confirmation
    - ui/src/pages/settings/clusters/Clusters.test.tsx:removes a cluster after typing its name, warning about its applications
  notes: >-
    Details poll every 5 s (upstream: 1 s). Adding a cluster is CLI/declarative only, as upstream;
    the UI shows the commands and a Cluster + Secret example. Reads are RegisteredCluster
    (credential flags only); edits send the flat ClusterInput with updatedFields, never the
    write-only config. A 403 for an unknown cluster (the server answers 403 for missing and
    forbidden clusters) is shown as "Cluster not found".

