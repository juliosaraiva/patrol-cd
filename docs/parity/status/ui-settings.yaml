# Web UI, Settings area (ui/src/pages/settings). See docs/architecture/components/ui.md.
# Evidence is vitest + Testing Library against MSW mocks of the /api/v1 contract (pnpm -C ui test):
# the pages are implemented, not verified end to end. Types come from the published
# api/openapi/openapi.json, and ui/src/api/contract.test.ts checks every client request and every
# default mock answer against that document (simulated server, not a real one). Playwright
# journeys for a real server live in ui/e2e/settings.spec.ts and have not been run.

API-101:
  status: implemented
  impl:
    - ui/src/pages/settings/repositories/RepositoriesPage.tsx
    - ui/src/pages/settings/repositories/RepositoryForm.tsx
    - ui/src/pages/settings/repositories/model.ts
    - ui/src/pages/settings/repocreds/RepoCredsPage.tsx
    - ui/src/api/hooks/settings.ts
  tests:
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:connects an HTTPS repository after a successful connection test
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:explains a failed connection test and allows saving anyway
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:saves the credentials as a template for the URL prefix
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:disconnects a repository after confirmation
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:refreshes connection status with forceRefresh
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:lists and connects write repositories when the hydrator is enabled
    - ui/src/pages/settings/repocreds/RepoCredsPage.test.tsx:creates an SSH template with a URL prefix
    - ui/src/pages/settings/repocreds/RepoCredsPage.test.tsx:lists templates with their prefix, authentication and whether credentials are stored
    - ui/src/pages/settings/repositories/RepositoriesPage.test.tsx:shows a loading state, then repositories with type, project and connection status
    - ui/src/pages/settings/common/settingsLogic.test.ts:builds method-specific specs and credentials
    - ui/src/api/contract.test.ts
  notes: >-
    Methods HTTPS (basic or bearer, TLS client cert, force basic auth, LFS, proxy/no-proxy,
    depth, Azure workload identity), SSH (insecureIgnoreHostKey with warning), GitHub App (or an
    SCMProvider reference), Helm (OCI), OCI, Google Cloud and Azure service principal. Connect
    validates with POST .../validate first and explains failures. Lists show RepositoryInfo /
    RepositoryCredentialInfo: connection state and whether credentials are stored or inherited
    from a template (hasCredentials, inheritedCredentials), never values. Secrets are write-only
    (`credentials` of the write request); spec.credentialsRef is server-managed and only
    repeated unchanged on updates. Upstream's "Create application" row action is not provided.
    Write repositories/templates are shown only when settings.hydratorEnabled.

API-102:
  status: implemented
  impl: [ui/src/pages/settings/certificates/CertificatesPage.tsx, ui/src/pages/settings/common/trustData.ts]
  tests:
    - ui/src/pages/settings/certificates/CertificatesPage.test.tsx:validates and adds a TLS certificate
    - ui/src/pages/settings/certificates/CertificatesPage.test.tsx:parses known hosts, previews fingerprints and adds one entry per host
    - ui/src/pages/settings/certificates/CertificatesPage.test.tsx:removes an entry after confirmation
  notes: >-
    certData is plain PEM text / the base64 SSH key, as the published document defines (not
    base64-wrapped as upstream's gRPC gateway requires); the list route omits certData. SSH
    fingerprints are computed in the browser for the preview and read from certInfo for stored
    entries.

