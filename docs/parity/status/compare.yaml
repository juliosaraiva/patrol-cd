# internal/compare (application state comparison engine). See
# docs/architecture/components/compare.md (commands and results under "Verification").
# Library-level evidence: the Application reconciler, the controller tree API and the API
# server do not call the engine yet, so no status write, event, API, CLI or UI surface is
# exercised. envtest tests use a real kube-apiserver 1.36 with the real cache, diff, tracking,
# health, project and settings packages and a fake repo-server returning canned manifests.

DIFF-028:
  status: implemented
  impl: [internal/compare/compare.go]
  tests:
    - internal/compare/envtest_test.go:TestEnvCompareLifecycle
    - internal/compare/envtest_test.go:TestEnvIgnoreExtraneousDoesNotHideModifications
  notes: >-
    Extraneous resources with compare-options IgnoreExtraneous stay OutOfSync (and
    requiresPruning) without making the Application OutOfSync; a modified resource carrying the
    annotation still does.

DIFF-029:
  status: implemented
  impl: [internal/compare/target.go, internal/compare/compare.go]
  tests:
    - internal/compare/unit_test.go:TestNormalizeTargets
    - internal/compare/unit_test.go:TestNormalizeTargetsGenerateNameKeys
    - internal/compare/envtest_test.go:TestEnvNamespaceDefaulting
    - internal/compare/envtest_test.go:TestEnvMultiSourceLastWins
  notes: >-
    Namespace stripping/defaulting from discovery (unknown scope = namespaced), tracking
    re-applied, generateName keys, last duplicate wins with the upstream RepeatedResourceWarning
    text, InvalidSpecError "Namespace for <name> <gvk> is missing.". Deviation: a tracking
    failure marks the comparison Unknown instead of continuing without targets.

DIFF-030:
  status: implemented
  impl: [internal/compare/compare.go, internal/compare/status.go]
  tests:
    - internal/compare/envtest_test.go:TestEnvCompareLifecycle
    - internal/compare/envtest_test.go:TestEnvHooksExcludedFromHealth
    - internal/compare/envtest_test.go:TestEnvCopiedTrackingIsNotManaged
    - internal/compare/envtest_test.go:TestEnvProjectRestrictions
    - internal/compare/envtest_test.go:TestEnvRepoErrorComparisonError
    - internal/compare/envtest_test.go:TestEnvManagedNamespaceMetadata
    - internal/compare/unit_test.go:TestRequiresDeletionConfirmation
  notes: >-
    Resource status rules (hooks/ignored/Skip/copied ids without status; OutOfSync for
    modified, missing, extraneous; denied kinds Unknown; load failures Unknown everywhere;
    managed namespace metadata change), requiresPruning, requiresDeletionConfirmation, sync
    waves (hooks from the matching hook target). Persisting status.resources is the
    controller's job.

