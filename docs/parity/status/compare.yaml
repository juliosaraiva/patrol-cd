    - internal/controller/app/liveevents_test.go:TestOnResourceUpdated
    - internal/controller/app/liveevents_test.go:TestOnResourceUpdatedPopulatedInfo
  notes: >-
    The cache populator hashes tracked resources, Applications and annotated untracked ones
    with the ignoreResourceUpdates rules; SkipResourceUpdate compares hash and health. The
    controller's live-event handler (internal/controller/app/liveevents.go) drops an update
    with equal hashes and health before attribution; creates and deletes are never dropped.

