    resourceVersion, generation and managedFields are always ignored by the update hash. Core
    Endpoints never refresh the Application they belong to; as upstream (handleObjectUpdated),
    an Endpoints change that leaves no Application to refresh is treated like any unattributed
    object and refreshes the orphan-monitoring Applications of its namespace. The refresh
    request is logged at info for a root (managed) object and at debug otherwise; upstream also
    logs orphan-monitor refreshes at info (it compares those Applications at level recent,
    Patrol refreshes their tree only).

OPS-073:
  status: implemented
  impl: [internal/controller/core/metrics.go, internal/controller/app/status.go, internal/controller/app/state.go, internal/controller/app/reconciler.go]
  tests:
    - internal/controller/core/metrics_test.go:TestOrphanedResourcesMetric
    - internal/controller/core/metrics_test.go:TestOrphanedResourcesMetricConcurrent
    - internal/controller/app/reconciler_test.go:TestReconcileForgetsOrphanedSeries
    - internal/controller/app/specerror_test.go:TestSpecErrorClearsTreeState
    - internal/controller/app/specerror_test.go:TestTreeRefreshOrphanedSeries
    - internal/controller/app/specerror_test.go:TestComparisonWithoutTreeKeepsOrphanedSeries
    - internal/controller/integration/orphans_test.go:TestOrphanedResourcesRefresh
  notes: >-
    patrol_app_orphaned_resources_count{namespace,name,project}, set after every tree build
    (comparison or tree-only refresh): one series per Application, under its current project.
    Not emitted for Applications whose project does not monitor orphaned resources (upstream
    sets 0). Beyond upstream, a project change moves the series (upstream keeps the old
    project's series until the optional metrics cache expiration), and the series is removed
    when the Application is deleted, when its spec is invalid (no comparison; the stored tree
    is then empty, as upstream, so a tree-only refresh compares again), and when this
    replica stops processing it (namespace no longer allowed, cluster of another shard); an
    Application with skip-reconcile keeps it, as it keeps the rest of its state.

