APP-084:
  status: implemented
  impl: [internal/controller/app/refresh.go, internal/controller/app/status.go, internal/controller/app/state.go, internal/controller/app/liveevents.go]
  tests:
    - internal/controller/app/refresh_test.go:TestNeedRefresh
    - internal/controller/integration/reconcile_test.go:TestRefreshAnnotationAndRecentRefresh
    - internal/controller/app/liveevents_test.go:TestLiveRefreshLogLevel
  notes: >-
    Levels recent/latest/force-resolve plus tree-only refreshes; a spec generation not yet
    observed requests latest (upstream reacts to the specific spec differences listed). A live
    object change is logged as the refresh cause at info for a root (managed) object and at
    debug otherwise, including orphan-monitor refreshes (upstream logs those at info: it
    compares orphan-monitoring Applications at level recent, Patrol refreshes their tree only);
    the attributes are named differently (comparisonLevel, group/kind/name, server as the
    cluster key).

APP-085:
  status: implemented
  impl: [internal/controller/app/liveevents.go, internal/controller/app/reconciler.go]
  tests:
    - internal/controller/app/liveevents_test.go:TestOnResourceUpdated
    - internal/controller/app/liveevents_test.go:TestRefreshOrphanMonitors
    - internal/controller/app/reconciler_test.go:TestIndexKeys
    - internal/controller/integration/autosync_test.go:TestSelfHeal
    - internal/controller/integration/reconcile_test.go:TestRefreshAnnotationAndRecentRefresh
    - internal/controller/integration/orphans_test.go:TestOrphanedResourcesRefresh
  notes: >-
    Managed (root) resources → recent comparison; descendants → tree-only refresh. Suppression
    by ignoreResourceUpdates runs before attribution; the Applications of the old and the new
    object are both refreshed; the changed Application object itself (same UID, as upstream) is
    skipped. A namespaced
    object attributed to no Application gives the orphan-monitoring Applications of its
    namespace and cluster a tree-only refresh (upstream: CompareWithRecent; the orphaned nodes,
    condition and gauge are the same, but a managed resource that was Missing at the last
    comparison stays Missing until the next one), found through in-memory field indexes (Applications by
    destination namespace, AppProjects with spec.orphanedResources); Applications outside the
    allowed namespaces or of other shards are skipped. Upstream matches orphan monitors by
    namespace on any cluster; Patrol also matches the event's cluster.

