    - test/integration/clusterinfo_test.go:TestClusterInfoCountsServedNamespaces
    - test/integration/recovery_test.go:TestDestinationUnreachable
  evidence: docs/verification/log.md#V-0046; docs/verification/log.md#V-0047; docs/verification/log.md#V-0049; docs/verification/log.md#V-0050; docs/verification/log.md#V-0051
  notes: >-
    Not complete: the implicit in-cluster cluster, the destination of a default install, has no
    object and so no Application count, API versions or cache information; GET /clusters shows the
    probe only, and GET manifests renders without its API versions (#246). Registering a Cluster
    object for that server is the workaround. For the clusters that have an object it is exercised
    through the API and the CLI, not the UI. Written to Cluster.status instead of Redis (ADR-0004):
    an unchanged status is not written, a change of the cache statistics alone is written at most
    once a minute, and connectionState.attemptedAt moves when the connection status or message
    changes, not with each check as upstream's modifiedAt does. A status write reaches
    no comparison: the Cluster watches ignore it. It moves the resourceVersion, so a client that
    sends one gets 409 after a status write; the UI sends none. Nothing expires the status, where
    upstream's Redis entry lapses after 10 minutes: with every controller stopped the last state
    stays. A skip-reconcile cluster reports Unknown, and so does a cache from its invalidation to
    the next sync. Validation and GET manifests read serverVersion and apiVersions from the status
    where upstream asks the destination, so unlike upstream's entry they stay until a destination
    answers again: a stale value after a destination upgrade, with no cache to report it, instead
    of Helm's default version. As upstream, a destination that fails under a synced cache shows as Failed only
    after the next full sync (restart, invalidate-cache, credential change, 12 h resync).

