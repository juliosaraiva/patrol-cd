OPS-030:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/_bootstrap.tpl, deploy/helm/patrol-cd/templates/rbac/bootstrap.yaml]
  tests: [test/deploy/rbac_test.go:TestRBACSufficiency, test/deploy/helmlifecycle_test.go:TestHelmLifecycle]
  evidence: docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    The bootstrap init container runs with the primary pod's service account and the rendered
    bootstrap Role (server pod, controller pod in core): Secrets created before the main
    containers start; patrol-server reads the internal token through the API on the first start
    (optional, still empty token volume). helm upgrade and rollback keep the generated keys;
    helm uninstall removes patrol-secret (chart-managed) and keeps patrol-internal-token and
    patrol-initial-admin-secret. A re-install's bootstrap keeps the internal token and replaces
    the initial admin Secret, which predates the re-rendered patrol-secret (finding DV-6,
    fixed): new password and Secret UID; the new password logs in through the server's login
    path (internal/auth), the stale initial password and the password changed before the
    uninstall do not. On kind (2026-10-19, default profile, server pod only)
    hack/kind/verify-install.sh asserts that the init container converged and created
    patrol-initial-admin-secret, and with --lifecycle the DV-6 behavior through the running
    server: after a password change through the API, helm uninstall and install, the Secret has a
    new UID, the changed and the old initial passwords get 401 and the new one 200. The internal
    token surviving the uninstall was observed by hand only, and the core profile (bootstrap on
    the controller pod, optional token mount) never ran on a kubelet, so the entry stays
    in-progress.

OPS-031:
  status: verified
  impl: [deploy/helm/patrol-cd/templates/_bootstrap.tpl]
  tests:
    - test/deploy/rbac_test.go:TestRBACSufficiency
    - hack/kind/verify-install.sh:bootstrap (the init container converged; patrol-initial-admin-secret exists)
    - hack/kind/verify-install.sh:api (admin login with the Secret's password returns 200 from the running patrol-server through NodePort 30443)
    - hack/kind/verify-install.sh --lifecycle (after helm uninstall and install the regenerated Secret's password logs in; the old initial and the changed password get 401)
  evidence: docs/verification/runs/2026-10-19-kind-validation.md; docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    The password written by the bootstrap init container to patrol-initial-admin-secret logs in
    to the emulated patrol-server pod (profiles with the admin account enabled, envtest) and,
    on kind (2026-10-19), to the real patrol-server pod of the chart's default profile, read
    from the Secret with kubectl and sent only through pipes. Limits: default profile only (the
    other admin-enabled profiles ran emulated), one replica, kindnet, linux/arm64. The
    `patrol admin initial-password` command was not run on kind (envtest only, bootstrap.yaml
    and cli-admin.yaml).
