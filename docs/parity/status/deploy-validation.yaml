# Deployment validation harness (test/deploy): the Helm chart, the static manifests and the CRDs
# checked against a real kube-apiserver 1.36 (envtest binaries) and the real patrolcd binary.
# Commands and results: docs/verification/runs/2026-10-17-deploy-validation.md; findings:
# docs/verification/phase4-findings.md (section "From the deployment validation task").
# Evidence level: API server behavior is real (strict server-side dry runs, Pod Security
# admission, RBAC authorizer, audit log, helm install/upgrade/rollback/uninstall, server-side
# apply). Pods are emulated: envtest has no kubelet, scheduler, controllers or CNI, so the
# harness runs each rendered patrolcd container as a local process with its service account's
# token, rendered arguments and environment, and Secret/ConfigMap volumes copied from the API
# server (deviations listed in the run record).
# Second review round (2026-10-18), harness changes and targeted runs:
# docs/verification/runs/2026-10-18-phase4-review-round2.md; final full-suite result:
# docs/verification/log.md (V-0027).
# Kind validation (2026-10-19, docs/verification/runs/2026-10-19-kind-validation.md): the chart's
# default profile ran on a cluster with nodes and was checked by hack/kind/verify-install.sh
# (clean-room run 55 of 55 with --lifecycle and the script as it was then, docs/verification/log.md
# V-0031; closing clean-room run after the review fixes, 58 of 58 checks, V-0032; the other
# profiles and the static manifests had no committed check on kind (cluster-install was applied
# once by hand). An entry is raised only where a kind check asserts its whole claim; the others
# stay in-progress. Limits: kindnet, linux/arm64, one replica per component, Kubernetes v1.36.4.

OPS-001:
  status: in-progress
  impl: [deploy/helm/patrol-cd, deploy/manifests/install.yaml]
  tests:
    - test/deploy/apivalidation_test.go:TestAPIServerDryRun
    - test/deploy/helmlifecycle_test.go:TestHelmLifecycle
    - test/deploy/manifests_test.go:TestStaticManifestsApply
    - test/deploy/manifests_test.go:TestStaticManifestsMatchChart
    - test/deploy/rbac_test.go:TestRBACSufficiency
  evidence: docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    Default profile: every rendered object passes a strict server-side dry run without warnings;
    helm install, no-op upgrade (none of the 60 rendered objects changed: resourceVersion
    compared, or generation, labels and annotations for the CRDs and the admission policy, whose
    status the API server writes; generated keys kept), upgrade with values, image tag, common
    labels and a disabled component (selectors and Service clusterIPs unchanged), rollback,
    uninstall (CRDs and admission policy kept) and re-install work against a kube-apiserver;
    install.yaml server-side applies, re-applies without changes and deletes. The rendered
    components run as their service accounts with exactly the rendered RBAC and sync an
    Application to the local cluster without a denied request. In this harness no pod ran on a
    node. On kind (2026-10-19) the chart's default profile ran with real pods and passed
    hack/kind/verify-install.sh (see chart.yaml OPS-001); install.yaml (the cluster-install
    overlay with the local image) was applied to patrol-target only by hand (61 objects, five
    pods Running, admin login 200 through a port-forward; the controllers waited about a minute
    for patrol-internal-token with FailedMount events until the server's bootstrap created it),
    which is not a test, so this entry stays in-progress.

