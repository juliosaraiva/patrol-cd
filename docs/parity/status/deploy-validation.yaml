  notes: >-
    Namespaced profile installed next to a cluster-wide release (CRDs from the latter); with the
    local cluster registered with explicit namespaces the controller syncs into the release
    namespace with Roles only; SubjectAccessReviews confirm no access outside the release
    namespace and rbac.managedNamespaces and no cluster-scoped reads. rbac.managedNamespaces must
    exist before the install (finding DV-3).

