OPS-007:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/rbac]
  tests:
    - test/deploy/rbac_test.go:TestRBACSufficiency
    - test/deploy/rbac_test.go:TestRBACMissingRuleDetected
  evidence: docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    Cluster-scoped rules exercised by the real binaries (default, core, hardened, minimal,
    hydrator, ingress-nginx, apps-in-any-namespace runs): no request denied in the audit log, no
    "forbidden" in component logs. SubjectAccessReviews: controller cluster-admin by default
    (documented), limited by rbac.controller.rules in the hardened profile (an Application still
    syncs; no RBAC, admission, node, namespace or subresource writes such as
    serviceaccounts/token or pods/exec, while Secret writes in any namespace and get on
    nodes/proxy remain, as documented), patrol-server may read but not create on the local
    cluster, no access with rbac.server.localCluster=false. Unexercised verbs are listed in the
    findings (informational).

OPS-008:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates/rbac]
  tests:
    - test/deploy/rbac_test.go:TestRBACSufficiency
    - test/deploy/rbac_test.go:TestRBACMissingRuleDetected
  evidence: docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    Namespaced Roles bound to the components' service accounts are sufficient for bootstrap,
    patrol-server (login, repositories, Applications, ApplicationSets, manual sync), the
    controller (shard Lease, sync, Operations), the ApplicationSet controller (leader election,
    list generator) and the notifications controller (leader election); the repo-server and
    commit-server run without a token. Removing the notifications Lease rules or patrol-server's
    AppProject rule is detected (audit 403 and "forbidden" log lines).

OPS-009:
  status: in-progress
  impl: [deploy/helm/patrol-cd/templates]
  tests: [test/deploy/wiring_test.go:TestWiring, test/deploy/rbac_test.go:TestRBACSufficiency]
  evidence: docs/verification/runs/2026-10-17-deploy-validation.md
  notes: >-
    Every listener computed from the parsed arguments (wiring.md port table) is a declared
    containerPort and vice versa; every Service selects one pod template and targets declared
    ports; the headless controller Service carries 8090. The harness reaches every component
    through its Service mapping and its readiness, liveness and startup probes answer 200
    (emulated pods, no kube-proxy). On kind (2026-10-19, default profile)
    hack/kind/verify-install.sh reaches patrol-server's https port through NodePort 30443 and
    the metrics Services patrol-controller-metrics:8082, patrol-server-metrics:8083,
    patrol-repo-server:8084 and patrol-notifications-controller-metrics:9001 from another
    namespace; the repo-server's 8081 is used by the syncs but not checked on its own, and the
    ApplicationSet controller's Service, the HTTP-to-HTTPS redirect and the commit-server and
    Dex Services were not exercised on kind, so the entry stays in-progress.

