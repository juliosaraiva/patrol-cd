TEN-107:
  status: different-by-design
  impl: [internal/apiserver/core/session.go]
  tests:
    - internal/apiserver/core/session_test.go:TestLogoutRevokesSession
    - internal/apiserver/core/session_test.go:TestNoRenewalOnSessionEndingRoutes
  notes: >-
    DELETE /session also revokes the login or SSO session (upstream only clears the cookie and
    revokes in /auth/logout), so a replayed token is rejected; the logout response never
    carries a renewed session token, also inside the renewal window. See
    docs/architecture/components/apiserver.md#differences-and-gaps.

TEN-108:
  status: in-progress
