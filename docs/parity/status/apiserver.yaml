# internal/apiserver (framework, session/SSO/account/settings/version routes, server
# lifecycle) and pkg/apiclient (Go client base). See docs/architecture/components/apiserver.md.
# Evidence: HTTP tests through the real route chain with internal/auth TokenService,
# internal/rbac Enforcer and internal/settings snapshots; envtest for the patrol-secret store;
# an in-process OIDC provider and a fake Dex for SSO. The patrol-server command wiring
# (cmd/patrolcd) and the resource services do not exist yet, so nothing here is "verified".
# Commands and results: docs/architecture/components/apiserver.md#verification.

API-001:
  status: in-progress
  impl: [internal/apiserver/core/routes.go, internal/apiserver/rest/route.go, api/openapi/openapi.json]
  tests:
    - internal/apiserver/server_test.go:TestCoreRouteTable
    - internal/apiserver/server_test.go:TestOpenAPIUpToDate
  notes: >-
    Route table framework plus the account, session, settings and version families (16
    operations). Application, ApplicationSet, project, repository, cluster, certificate, GPG
    key and notification services are registered by their own packages later.

API-002:
  status: in-progress
  impl: [internal/apiserver/server.go, internal/apiserver/tls.go]
  tests:
    - internal/apiserver/server_test.go:TestServeTLSRedirectMetricsAndShutdown
    - internal/apiserver/server_test.go:TestServeTLSShutdownIdle
    - internal/apiserver/tls_internal_test.go:TestSplitListenerCloseIdempotent
    - internal/apiserver/server_test.go:TestTLSHelpers
  notes: >-
    HTTPS with the patrol-secret certificate read per handshake (rotation without restart) or a
    generated self-signed certificate, min/max TLS version and cipher suites, plain HTTP on the
    TLS port answered with 307 to https (root path kept once), --insecure plain HTTP. gRPC and
    gRPC-Web multiplexing are not provided (ADR-0005: JSON over HTTP).

