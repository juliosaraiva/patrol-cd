OPS-006:
  status: implemented
  impl: [deploy/manifests/crds.yaml, deploy/manifests/crds]
  tests: [hack/genmanifests/main_test.go:TestManifestsAreCurrent]
  evidence: docs/verification/runs/2026-10-17-manifests-static.md
  notes: >-
    crds.yaml (and the crds/ base) hold the 8 CRDs, the Operation ValidatingAdmissionPolicy and
    its binding with the chart's labels and without helm.sh/resource-policy. Against a
    kube-apiserver 1.36: client-side apply fails with 'The CustomResourceDefinition
    "applicationsets.cd.patrol.example" is invalid: metadata.annotations: Too long: may not be
    more than 262144 bytes'; kubectl apply --server-side --force-conflicts creates all ten
    objects and every CRD becomes Established. Every file header and the guide use server-side
    apply. Self-management with ServerSideApply=true is not exercised here.
