# internal/hydrator (source hydrator controllers). See docs/architecture/components/hydrator.md.
# Unit tests use the controller-runtime fake client; integration tests run the controllers
# in a manager against envtest (kube-apiserver 1.36, generated CRDs) with a fake
# repo-server and the real commit-server (HTTP) writing to a local bare repository. The
# hydrator is not wired into patrolcd controller yet, so nothing here is "verified".

APP-113:
  status: in-progress
  impl: [internal/hydrator/hydrator.go, internal/hydrator/deps.go]
  tests:
    - internal/hydrator/key_test.go:TestNewValidatesDeps
    - internal/hydrator/envtest_test.go:TestEnvHydrationLifecycle
  notes: >-
    Setup registers nothing when Deps.Enabled (hydrator.enabled) is false; with it on,
    Applications get status.sourceHydrator. Missing: controller/cmd wiring of the flag and
    commit.server address, settings API hydratorEnabled, UI gating.

APP-114:
  status: implemented
  impl: [internal/hydrator/evaluate.go]
  tests:
    - internal/hydrator/evaluate_test.go:TestEvaluate
    - internal/hydrator/evaluate_test.go:TestReconcileAppRecordsComparedRevision
    - internal/hydrator/evaluate_test.go:TestAppPredicate
    - internal/hydrator/process_test.go:TestReconcileKeySpecChangeDuringHydrationIsNotLost
    - internal/hydrator/envtest_test.go:TestEnvHydrationLifecycle
  notes: >-
    Upstream decision order. A spec change made while the group is hydrating is hydrated
    next (in-memory request coverage compares the spec the processing hydrated). Triggers: creation/initial listing, generation, hydrate and
    manifest-generate-paths annotations, status.sourceHydrator changes, and RequeueAfter
    polling (timeout.reconciliation). lastComparedDryRevision is written when no hydration
    follows; a hydration records the dry SHA it used (upstream writes it on every
    evaluation).

APP-115:
  status: implemented
  impl: [internal/hydrator/evaluate.go, internal/hydrator/status.go, internal/hydrator/process.go]
  tests:
    - internal/hydrator/evaluate_test.go:TestReconcileAppConsumesHydrateRequest
    - internal/hydrator/evaluate_test.go:TestReconcileAppRecordsComparedRevision
    - internal/hydrator/process_test.go:TestReconcileKeySkipsAlreadyHydratedDrySHA
    - internal/hydrator/envtest_test.go:TestEnvHydrationLifecycle
  notes: >-
    hard forces hydration and always calls the commit-server (no commit when output is
    unchanged); any other value is normal (revision cache bypassed, failed hydration
    retried). Removed with a JSON patch test operation so newer requests survive; consumed
    without effect while Hydrating. Setting it from the API/webhooks is elsewhere.

APP-116:
  status: implemented
  impl: [internal/hydrator/key.go, internal/hydrator/process.go, internal/hydrator/queue.go]
  tests:
    - internal/hydrator/key_test.go:TestKeyOf
    - internal/hydrator/process_test.go:TestReconcileKeyHydratesGroupInOneCommit
    - internal/hydrator/process_test.go:TestReconcileKeyRenderFailureFailsGroup
    - internal/hydrator/process_test.go:TestReconcileKeySelectsGroup
    - internal/hydrator/process_test.go:TestReconcileKeySkipsAlreadyHydratedDrySHA
    - internal/hydrator/process_test.go:TestReconcileKeyCoverage
    - internal/hydrator/process_test.go:TestReconcileKeySpecChangeDuringHydrationIsNotLost
    - internal/hydrator/envtest_test.go:TestEnvHydrationLifecycle
    - internal/hydrator/envtest_test.go:TestEnvHydrationFailureFailsGroup
  notes: >-
    Key and generic error messages as upstream; group sorted by qualified name. The
    already-hydrated skip requires every member (not only the first) to have hydrated the
    dry SHA with its current configuration, so added apps and changed paths are written
    without a new dry commit.

