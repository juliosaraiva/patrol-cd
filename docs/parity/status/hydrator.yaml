APP-118:
  status: implemented
  impl: [internal/hydrator/render.go]
  tests:
    - internal/hydrator/process_test.go:TestReconcileKeyHydratesGroupInOneCommit
    - internal/hydrator/envtest_test.go:TestEnvHydrationLifecycle
  notes: >-
    NoCache/NoRevisionCache, tracking metadata stripped (tracking-id, installation-id, or the
    instance label), commands recorded per path, upstream error prefixes. Renders go
    through a fake repo-server in tests (Helm valueFiles/parameters not exercised). The
    destination Kubernetes version is sent when Deps.ClusterInfo is set (upstream sends
    none; nil reproduces upstream).

