DIFF-076:
  status: in-progress
  impl: [internal/tracking/tracker.go, internal/tracking/metadata.go]
  tests:
    - internal/tracking/tracker_test.go:TestGetAppNameUntrackedOrMalformed
    - internal/tracking/tracker_test.go:TestDetectSharedResource
    - internal/tracking/tracker_test.go:TestIsManagedByOwnedChild
    - internal/tracking/tracker_test.go:TestIsManagedByOwnerReferenceShapes
    - internal/tracking/property_test.go:TestPropertyOwnedObjectIsNotManaged
    - internal/tracking/envtest_test.go:TestEnvtestOwnedChildIsNotManaged
  notes: >-
    Tracking-derived app name, shared-resource detection, and the managed-root predicate
    IsManagedBy (tracked by the app, no ownerReferences, self-referenced): an owned child
    carrying the inherited instance label is attributed to the app but not managed (required
    negative test; envtest with a Deployment-owned ReplicaSet). Live-set assembly (cache
    iteration, synthesized owners such as Endpoints -> Service, full-manifest caching, adoption
    of untracked target matches) is internal/cache + controller.

