APP-073:
  status: implemented
  impl: [internal/tracking/tracker.go]
  tests:
    - internal/tracking/tracker_test.go:TestCustomInstanceLabelKey
    - internal/tracking/tracker_test.go:TestRemoveAppInstance
    - internal/tracking/normalize_test.go:TestNormalizeCustomLabelKey
  notes: >-
    Configurable key (default app.kubernetes.io/instance); RemoveAppInstance removes the
    default key even with a custom key, as upstream. The legacy key
    applications.argoproj.io/app-name is not mapped (api/v1alpha1/keys.go), so its pod-template
    labeling is not reproduced.

APP-074:
  status: implemented
  impl: [internal/tracking/tracker.go]
  tests:
    - internal/tracking/tracker_test.go:TestInstallationID
    - internal/tracking/tracker_test.go:TestInstallationIsolation
    - internal/tracking/property_test.go:TestPropertySetAppInstanceRoundTrip
    - internal/tracking/envtest_test.go:TestEnvtestAnnotationTracking
  notes: >-
    installation-id annotation written when configured, removed otherwise, matched exactly
    (both empty matches); IsManagedBy is false for other installations' resources. The
    installation ID is not secret, so it prevents accidental adoption between installations,
    not deliberate forgery. The controller's prune decision must require IsManagedBy plus
    AppProject permission checks (not yet wired).

