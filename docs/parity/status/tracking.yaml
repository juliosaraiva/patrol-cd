# internal/tracking (resource tracking library). See docs/architecture/components/tracking.md.
# Library-level evidence only: no controller, repo-server, cache or hydrator consumes the
# package yet, so features whose behavior spans those components are in-progress.

APP-069:
  status: in-progress
  impl: [internal/tracking/instance.go]
  tests:
    - internal/tracking/instance_test.go:TestInstanceName
    - internal/tracking/instance_test.go:TestParseInstanceName
    - internal/tracking/instance_test.go:TestInstanceNameFromQualified
    - internal/tracking/tracker_test.go:TestSetAppInstanceRoundTrip
    - internal/tracking/envtest_test.go:TestEnvtestAnnotationTracking
  notes: >-
    Instance names (name in the control-plane namespace, <namespace>_<name> otherwise) and
    qualified/instance conversion; tracking ids of apps in other namespaces start with
    "<ns>_<name>:". CLI name parsing and RBAC object names (internal/rbac.AppObject) are
    other components.

APP-070:
  status: in-progress
  impl: [internal/tracking/tracker.go, internal/tracking/trackingid.go]
  tests:
    - internal/tracking/tracker_test.go:TestSetAppInstanceRoundTrip
    - internal/tracking/tracker_test.go:TestGetAppNameUntrackedOrMalformed
    - internal/tracking/trackingid_test.go:TestParseTrackingID
    - internal/tracking/property_test.go:TestPropertyTrackingIDRoundTrip
    - internal/tracking/envtest_test.go:TestEnvtestAnnotationTracking
  notes: >-
    Exact tracking-id format (destination namespace for cluster-scoped resources), parse
    errors with the upstream message mean not owned, label-only metadata grants no ownership,
    installation-id written/removed. IsManagedBy excludes objects with ownerReferences, as the
    upstream managed live set does. Live-set assembly (cache iteration, synthesized owners,
    adoption of untracked objects matching a target) belongs to internal/cache and the
    controller.

