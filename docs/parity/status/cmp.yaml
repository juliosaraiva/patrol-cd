SRC-078:
  status: different-by-design
  impl: [internal/cmp/exec.go, internal/cmp/server.go, internal/cmp/options.go]
  tests:
    - internal/cmp/server_test.go:TestGenerateEndToEnd
    - internal/cmp/server_test.go:TestEnvironmentIsolation
    - internal/cmp/server_test.go:TestEnvironmentIsolationProcessEnv
    - internal/cmp/server_test.go:TestEnvironmentPassAll
    - internal/cmp/options_test.go:TestRunEndToEnd
  notes: >-
    Sidecar side. Different by design (ADR-0007 allow-list env): by default plugin commands get
    PATH/HOME/TMPDIR/LANG, not the sidecar's whole process environment as upstream
    (cmpserver/plugin/plugin.go append(os.Environ(), ...)), so plugins reading sidecar variables
    (argocd-vault-plugin AVP_*/VAULT_ADDR, proxies) need PATROL_CMP_PASS_ENV; `*` restores
    upstream (TestEnvironmentPassAll); the active mode is logged at startup. As upstream in
    every mode: the request env (build vars, KUBE_VERSION, KUBE_API_VERSIONS, ARGOCD_ENV_*,
    PARAM_*) follows the plugin env and wins on duplicates. See
    docs/architecture/components/cmp.md#migrating-plugins-from-argo-cd. The merged matrix row
    shows the client side's `implemented` (render.yaml) because hack/parity applies
    different-by-design only when every overlay agrees.

