SRC-085:
  status: implemented
  impl: [internal/cmp/server.go]
  tests:
    - internal/cmp/server_test.go:TestRejectedStreams
    - internal/cmp/server_test.go:TestGenerateEndToEnd
    - internal/cmp/receive_test.go:TestStalledStream
  notes: >-
    Receiving side: metadata validation, bounded body and archive (Patrol adds compressed,
    extracted and entry-count limits; upstream has none), checksum/size verification, safe
    extraction, out-of-bounds appRelPath rejection. Reception ends at the client deadline
    (as upstream's per-chunk context check) or after PATROL_CMP_RECEIVE_TIMEOUT (5 min); a
    connection read deadline interrupts stalled reads. HTTP stream instead of gRPC chunks.

SRC-088:
  status: implemented
  impl: [internal/cmp/server.go, internal/cmp/exec.go]
  tests:
    - internal/cmp/server_test.go:TestExecTimeout
    - internal/cmp/server_test.go:TestClientDeadline
    - internal/cmp/exec_test.go:TestRunnerErrors
    - internal/cmp/receive_test.go:TestStalledStream
    - internal/cmp/receive_test.go:TestReceiveDeadlineDoesNotBoundCommands
  notes: >-
    Client deadline minus 100 ms bounds the receive phase (stalled streams answered 504 at the
    deadline) and the commands: SIGTERM then SIGKILL after 5 s to the process group
    (grandchildren verified dead by PID). Patrol also enforces a per-command exec timeout
    (PATROL_EXEC_TIMEOUT / ARGOCD_EXEC_TIMEOUT, default 90 s), which upstream documents but its
    cmp-server does not apply.

