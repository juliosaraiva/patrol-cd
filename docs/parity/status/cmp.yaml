# internal/cmp (config management plugin sidecar server, `patrolcd cmp-server`).
# See docs/architecture/components/cmp.md. Library-level evidence: tests run the server on real
# unix sockets with real sh/find/sleep and drive it with the repo-server's CMP client
# (internal/render). Not yet exercised through the `patrolcd cmp-server` binary, the repo-server
# RPCs or a cluster (cmd/patrolcd and the Helm chart do not wire it yet), hence `implemented`.

