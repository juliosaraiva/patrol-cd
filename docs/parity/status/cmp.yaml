  tests:
    - internal/cmp/server_test.go:TestSocketLifecycle
    - internal/cmp/server_test.go:TestShutdown
    - internal/cmp/options_test.go:TestRunEndToEnd
  notes: >-
    cmpwire HTTP over the unix socket instead of gRPC (ADR-0006); socket mode 0600. Socket is
