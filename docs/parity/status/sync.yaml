SYNC-071:
  status: different-by-design
  impl: [internal/sync/step.go, internal/sync/exec.go, internal/sync/plan.go, internal/sync/engine.go]
  tests:
    - internal/sync/step_test.go:TestStepDryRunFailureStopsEverything
    - internal/sync/step_test.go:TestStepDryRunSkipsStateReplacedBySync
    - internal/sync/step_test.go:TestStepTransientErrorDuringDryRunRepeatsDryRun
    - internal/sync/envtest_test.go:TestEnvValidateFalse
    - internal/sync/envtest_test.go:TestEnvDryRunBeforeHookCreationImmutableChange
    - internal/sync/envtest_test.go:TestEnvDryRunCRDSchemaChangeInSameSync
  notes: >-
    Server-side dry run (dryRun=All, required by docs/architecture/sync-state-machine.md)
    instead of kubectl's local client dry run. Tasks that would be validated against state
    the sync replaces are not sent: objects in a namespace the sync creates, hooks
    re-created by BeforeHookCreation, custom resources whose CRD the sync creates or
    changes. Remaining differences (immutable-field changes of patched objects fail before
    anything is applied; admission sees current state; SSA dry runs use SSA) are listed in
    docs/architecture/components/sync.md ("Known gaps and deviations", Dry run). A
    transient error before the dry run completed reports no rows, so the dry run is never
    skipped.

