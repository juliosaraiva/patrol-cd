    RBAC object "<project>/<server>" for project-scoped clusters on every route, including the
    new project on project changes (re-checked when the stored cluster moved project during
    an update); the project must exist. Destination permission is internal/project. Patrol
    differences (tenant boundary): a project-scoped grant cannot register the in-cluster
    server (it counts as existing: update on its unscoped object is required) nor store
    awsAuthConfig/execProviderConfig (the action on the unscoped "<server>" object is
    required).

