# Cluster and project API services (internal/apiserver/services/clusters,
# internal/apiserver/services/projects), the shared deep-link evaluator
# (internal/apiserver/services/links) and their pkg/apiclient types and methods. See
# docs/architecture/components/api-clusters-projects.md.
# Evidence: tests through pkg/apiclient against the real route chain (auth.TokenService,
# rbac.Enforcer, audit) and an envtest kube-apiserver 1.36 with the generated CRDs. Destination
# clusters are TLS front ends of the envtest API server that authenticate callers themselves;
# the service-account token controller is emulated by the tests. The services are not wired
# into the patrol-server command yet, so nothing here is "verified".
# Commands and results: docs/architecture/components/api-clusters-projects.md#verification.

