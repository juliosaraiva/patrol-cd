# Application API service (internal/apiserver/services/applications: core application
# routes) and its pkg/apiclient types and methods. See
# docs/architecture/components/api-applications.md.
# Evidence: tests through pkg/apiclient against the real route chain (auth.TokenService,
# rbac.Enforcer with project policies, audit with a Kubernetes Event recorder), an envtest
# kube-apiserver 1.36 with the generated CRDs (and the Operation admission policy), the real
# internal/project lookups and internal/repository resolver, and an Application informer feeding
# the Broadcaster. The repo-server is an in-process fake of its client interface; no controller
# runs (tests stand in for it where a reaction is needed). The service is not wired into the
# patrol-server command yet, so nothing here is "verified".
# Commands and results: docs/architecture/components/api-applications.md#verification.

APP-049:
  status: implemented
  impl: [internal/apiserver/services/applications/crud.go, pkg/apiclient/applications.go]
  tests:
    - internal/apiserver/services/applications/crud_test.go:TestCreateApplication
    - internal/apiserver/services/applications/crud_test.go:TestCreateApplicationDenials
    - internal/apiserver/services/applications/crud_test.go:TestAppsInAnyNamespace
    - internal/apiserver/services/applications/concurrency_test.go:TestCreateApplicationUpsertRace
  notes: >-
    Create with upsert and validate, idempotent identical create, exact upstream messages,
    create/update RBAC, namespace gate. A create that loses a race to a concurrent create
    applies the project change rules to the winning Application before an upsert. Patrol Applications have no operation field (Operation
    kind); an Application name owned by an Application the caller cannot get answers 409
    without content (deliberate difference).

