# CodeQL code scanning (docs/guides/claude-code-sdlc.md). The same analysis runs before every push
# (hack/sdlc/codeql.sh through make sdlc-check, same bundle, suite and configuration); this
# workflow uploads the results to GitHub code scanning, which tracks the alerts and shows new ones on
# pull requests. Code scanning is free for public repositories; this one is public.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "17 5 * * 1" # Mondays: new queries look at old code too
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0" # as every build of this repository (hack/build.mk, Dockerfile)

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
          # The bundle this pinned action version ships: CodeQL 2.27.3 (src/defaults.json at the commit
          # above), the version hack/sdlc/codeql.sh pins, so local and CI results agree. Bump both together.
          tools: linked
      - name: Build
        if: matrix.build-mode == 'manual'
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
