# PreSync hook: runs before any resource of the sync is applied. A failed hook fails the
# sync. BeforeHookCreation deletes the previous run's Job before the next sync creates it.
apiVersion: batch/v1
kind: Job
metadata:
  name: guestbook-schema-check
  labels:
    app.kubernetes.io/name: guestbook-schema-check
    app.kubernetes.io/part-of: patrol-examples
  annotations:
    cd.patrol.example/hook: PreSync
    cd.patrol.example/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.36
          command: ["sh", "-c", "echo 'pre-sync: schema version is current'"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
