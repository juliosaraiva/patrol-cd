# Default values for the guestbook chart. Every key is described by values.schema.json.

replicaCount: 1

image:
  repository: ghcr.io/stefanprodan/podinfo
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

ui:
  message: Hello from the guestbook Helm chart
  color: "#34577c"

service:
  type: ClusterIP
  port: 9898

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Renders a Namespace for the release namespace. Used by preview environments so that the
# namespace is pruned together with the Application (see examples/github).
namespace:
  create: false
  labels: {}

# Pre-install/pre-upgrade Job. Helm hooks are mapped to Patrol sync hooks
# (pre-install/pre-upgrade -> PreSync).
migration:
  enabled: true
  image: busybox:1.36
