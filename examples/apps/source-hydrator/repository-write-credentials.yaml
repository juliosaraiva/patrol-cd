# Write credentials used only by patrol-commit-server to push hydrated manifests. Write
# credentials are separate from read credentials (purpose: write) and are never sent to the
# repo-server.
apiVersion: cd.patrol.example/v1alpha1
kind: RepositoryCredential
metadata:
  name: examples-write
  namespace: patrol
spec:
  urlPrefix: https://git.example.com/platform/
  type: git
  purpose: write
  credentialsRef:
    name: examples-write-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: examples-write-credentials
  namespace: patrol
  labels:
    cd.patrol.example/secret-type: repo-write-creds
type: Opaque
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
