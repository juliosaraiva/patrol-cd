# Credentials of the notification services in patrol-notifications-cm ("$<key>").
apiVersion: v1
kind: Secret
metadata:
  name: patrol-notifications-secret
  namespace: patrol
  labels:
    app.kubernetes.io/name: patrol-notifications-secret
    app.kubernetes.io/part-of: patrol-cd
type: Opaque
stringData:
  slack-token: REPLACE_ME
  # PEM private key of the GitHub App.
  github-privateKey: REPLACE_ME
  deploy-tracker-token: REPLACE_ME
  email-username: REPLACE_ME
  email-password: REPLACE_ME
