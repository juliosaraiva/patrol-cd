# patrol-secret: server-side secrets of the settings (Argo CD's argocd-secret). Only
# placeholders here; create the real Secret out of band (sealed/external secrets, etc.).
# server.secretkey (session signing key) is generated at first start when missing, and
# admin.password is set by the bootstrap; neither belongs in Git.
apiVersion: v1
kind: Secret
metadata:
  name: patrol-secret
  namespace: patrol
  labels:
    app.kubernetes.io/name: patrol-secret
    app.kubernetes.io/part-of: patrol-cd
type: Opaque
stringData:
  # Shared secret configured on GitHub webhooks (X-Hub-Signature-256 verification).
  webhook.github.secret: REPLACE_ME
  webhook.gitlab.secret: REPLACE_ME
---
# Referenced from patrol-cm oidc.config as "$patrol-oidc:clientSecret". Secrets referenced
# this way must carry the part-of label.
apiVersion: v1
kind: Secret
metadata:
  name: patrol-oidc
  namespace: patrol
  labels:
    app.kubernetes.io/part-of: patrol-cd
type: Opaque
stringData:
  clientSecret: REPLACE_ME
