kind: ConfigMap
metadata:
  name: patrol-ssh-known-hosts-cm
  namespace: patrol
  labels:
    app.kubernetes.io/name: patrol-ssh-known-hosts-cm
    app.kubernetes.io/part-of: patrol-cd
