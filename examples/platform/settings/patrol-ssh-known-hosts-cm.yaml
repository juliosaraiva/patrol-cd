# patrol-ssh-known-hosts-cm: SSH host keys of Git servers (Argo CD's
# argocd-ssh-known-hosts-cm). The keys below are example keys generated for
# git.example.com; collect the real ones with `ssh-keyscan <host>` and verify their
# fingerprints against the fingerprints your Git hosting provider publishes.
