# GitHub with a (fine-grained) personal access token. Commit statuses work with tokens;
# check runs do not (GitHub restricts them to Apps), so statusReporting uses "statuses".
# statusReporting is validated but no component reads it yet (#235): nothing is reported.
apiVersion: cd.patrol.example/v1alpha1
kind: SCMProvider
metadata:
  name: github-token
  namespace: patrol
spec:
  type: github
  auth:
    tokenSecretRef:
      name: github-token
      key: token
  statusReporting:
    enabled: true
    mode: statuses
---
# Also referenced directly by the pull request generator example (tokenRef). Generators
# require the scm-creds label when tokenRef strict mode is enabled.
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: patrol
  labels:
    cd.patrol.example/secret-type: scm-creds
type: Opaque
stringData:
  token: REPLACE_ME
