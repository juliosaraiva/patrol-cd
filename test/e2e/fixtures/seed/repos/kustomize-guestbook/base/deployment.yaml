apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  labels:
    app.kubernetes.io/name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: guestbook-ui
          # Present offline on kind nodes (containerd sandbox image).
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
