# e2e git server: one pod, two containers over the same repositories (emptyDir /git).
#   http  smart HTTP on 8080 (Service port 80): /git/<repo>.git (basic auth) and
#         /public/<repo>.git (anonymous, read-only)
#   ssh   OpenSSH on 2222 (Service port 22): ssh://git@git-server.patrol-e2e.svc.cluster.local/git/<repo>.git
# Requires Secrets git-server-http-auth (username, password) and git-server-ssh-authorized-keys
# (authorized_keys), created by test/e2e/fixtures/deploy.sh, and git-server-ssh-host-key
# (ssh-host-key.secret.yaml). Repositories are lost when the pod is replaced: re-run the
# git-seed Job (deploy.sh does) to restore the seeded state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: patrol-e2e
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: patrol-e2e-fixtures
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: patrol-e2e-fixtures
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: http
          image: patrol-cd/e2e-git-server:dev
          imagePullPolicy: Never
          command: ["/sbin/tini", "--", "/usr/local/bin/git-http-entrypoint"]
          env:
            - name: GIT_HTTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-server-http-auth
                  key: username
            - name: GIT_HTTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-server-http-auth
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -S /run/fcgiwrap/fcgiwrap.sock && pgrep -x fcgiwrap >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: repos
              mountPath: /git
        - name: ssh
          image: patrol-cd/e2e-git-server:dev
          imagePullPolicy: Never
          command: ["/sbin/tini", "--", "/usr/local/bin/git-ssh-entrypoint"]
          ports:
            - name: ssh
              containerPort: 2222
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: repos
              mountPath: /git
            - name: ssh-host-key
              mountPath: /etc/git-server/ssh-host-key
              readOnly: true
            - name: ssh-authorized-keys
              mountPath: /etc/git-server/authorized-keys
              readOnly: true
      volumes:
        - name: repos
          emptyDir: {}
        - name: ssh-host-key
          secret:
            secretName: git-server-ssh-host-key
            defaultMode: 0400
        - name: ssh-authorized-keys
          secret:
            secretName: git-server-ssh-authorized-keys
            defaultMode: 0444
