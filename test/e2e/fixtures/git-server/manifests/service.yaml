apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: patrol-e2e
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: patrol-e2e-fixtures
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 80
