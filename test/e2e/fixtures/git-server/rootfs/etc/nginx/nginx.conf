# nginx for the Patrol CD e2e git server. Repositories live in /git (shared with the ssh
# container of the same pod).
#
#   /git/<repo>.git     basic auth (htpasswd generated at start from the git-server-http-auth
#                       Secret); clone, fetch and push. Pushing to a missing repository creates it.
#   /public/<repo>.git  anonymous, read-only.
#   /healthz            readiness.
user git git;
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080 default_server;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Pushes over the anonymous path are refused here; git-http-backend refuses them too,
        # because no REMOTE_USER is passed.
        location ~ ^/public/.+/git-receive-pack$ {
            return 403;
        }

        location ~ ^/public(?<git_path>/.+)$ {
            if ($arg_service = git-receive-pack) {
                return 403;
            }
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/bin/git-http-backend-wrapper;
            fastcgi_param PATH_INFO $git_path;
            fastcgi_param GIT_PROJECT_ROOT /git;
            fastcgi_param GIT_HTTP_EXPORT_ALL 1;
            fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
            fastcgi_read_timeout 300s;
        }

        location ~ ^/git(?<git_path>/.+)$ {
            auth_basic "patrol-e2e git";
            auth_basic_user_file /run/git-server/htpasswd;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/bin/git-http-backend-wrapper;
            fastcgi_param PATH_INFO $git_path;
            fastcgi_param GIT_PROJECT_ROOT /git;
            fastcgi_param GIT_HTTP_EXPORT_ALL 1;
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param PATROL_ALLOW_CREATE 1;
            fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
            fastcgi_read_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
