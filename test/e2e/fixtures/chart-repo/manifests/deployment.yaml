# e2e Helm chart repository: http://chart-repo.patrol-e2e.svc.cluster.local (anonymous) and
# http://chart-repo.patrol-e2e.svc.cluster.local/private (basic auth, Secret chart-repo-auth,
# created by test/e2e/fixtures/deploy.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-repo
  namespace: patrol-e2e
  labels:
    app.kubernetes.io/name: chart-repo
    app.kubernetes.io/part-of: patrol-e2e-fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chart-repo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-repo
        app.kubernetes.io/part-of: patrol-e2e-fixtures
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: nginx
          image: patrol-cd/e2e-chart-repo:dev
          imagePullPolicy: Never
          env:
            - name: CHART_REPO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chart-repo-auth
                  key: username
            - name: CHART_REPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chart-repo-auth
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
