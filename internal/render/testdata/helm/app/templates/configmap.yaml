apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cm
  namespace: {{ .Release.Namespace }}
data:
  key: {{ .Values.key | quote }}
  fromA: {{ .Values.fromA | quote }}
  fromB: {{ .Values.fromB | quote }}
  envName: {{ .Values.envName | quote }}
  flag: {{ .Values.flag | quote }}
  flagKind: {{ kindOf .Values.flag | quote }}
  fileContent: {{ .Values.fileContent | quote }}
  list: {{ .Values.list | toJson | quote }}
  nested: {{ .Values.nested.inner | quote }}
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  hasWidgetAPI: {{ .Capabilities.APIVersions.Has "example.com/v1" | quote }}
