apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer
rules:
- apiGroups: [""]
  resources: [configmaps, pods]
  verbs: [create, get, list]
- apiGroups: [apps, extensions]
  resources: [deployments]
  verbs: [Create]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list]
- nonResourceURLs: [/healthz]
  verbs: [get]
