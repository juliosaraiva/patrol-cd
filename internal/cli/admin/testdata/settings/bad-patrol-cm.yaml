apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-cm
  labels:
    app.kubernetes.io/part-of: patrol-cd
data:
  url: https://patrol.example.com
  # Not a YAML map.
  dex.config: |
    connectors: [unterminated
  kustomize.path.v1.0.0: /usr/bin/kustomize-a
  kustomize.version.v1.0.0: /usr/bin/kustomize-b
  accounts.robot: notacapability
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers: {not: a list}
