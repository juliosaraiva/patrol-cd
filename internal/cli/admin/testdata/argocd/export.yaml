apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-a
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Team A
  sourceRepos:
  - https://github.com/example/*
  destinations:
  - server: https://prod.example.com:6443
    namespace: team-a-*
  - name: aks-dev
    namespace: "*"
  sourceNamespaces:
  - team-a
  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  namespaceResourceBlacklist:
  - group: ""
    kind: ResourceQuota
  roles:
  - name: ci
    description: CI pipeline
    policies:
    - p, proj:team-a:ci, applications, sync, team-a/*, allow
    jwtTokens:
    - iat: 1767225600
      id: fake-project-token-id
status:
  jwtTokensByRole:
    ci:
      items:
      - iat: 1767225600
        id: fake-project-token-id
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  sourceRepos: ["*"]
  destinations:
  - server: "*"
    namespace: "*"
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.deployments: ""
    notified.notifications.argoproj.io: '{"on-sync-succeeded:abc:deployments:":1767225600}'
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/refresh: hard
  labels:
    team: platform
spec:
  project: default
  source:
    repoURL: https://github.com/example/apps.git
    path: guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /spec/syncPolicy
operation:
  sync:
    revision: HEAD
  initiatedBy:
    username: admin
status:
  sync:
    status: Synced
  health:
    status: Healthy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-hydrated
spec:
  project: default
  sourceHydrator:
    drySource:
      repoURL: https://github.com/example/apps.git
      path: guestbook
      targetRevision: HEAD
    syncSource:
      repoURL: https://github.com/example/hydrated.git
      targetBranch: environments/prod
      path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-hydrated
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: team-a
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
  annotations:
    argocd.argoproj.io/tracking-id: root:argoproj.io/Application:team-a/api
spec:
  project: team-a
  sources:
  - repoURL: https://charts.example.com
    chart: api
    targetRevision: 1.4.2
    helm:
      releaseName: api
      valueFiles:
      - $values/api/values-prod.yaml
  - repoURL: https://github.com/example/apps.git
    targetRevision: main
    ref: values
  destination:
    name: prod
    namespace: team-a-api
  syncPolicy:
    automated: {}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels:
          argocd.argoproj.io/secret-type: cluster
          env: prod
  template:
    metadata:
      name: "{{.name}}-addons"
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.deployments: ""
    spec:
      project: default
      source:
        repoURL: https://github.com/example/apps.git
        path: addons
        targetRevision: HEAD
      destination:
        server: "{{.server}}"
        namespace: addons
      syncPolicy:
        automated:
          prune: true
  syncPolicy:
    preserveResourcesOnDeletion: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-repos
spec:
  generators:
  - scmProvider:
      github:
        organization: example
        tokenRef:
          secretName: github-token
          key: token
      # Generator-level template: its fields win over spec.template when merged.
      template:
        metadata:
          finalizers:
          - resources-finalizer.argocd.argoproj.io
          annotations:
            argocd.argoproj.io/sync-wave: "1"
        spec:
          project: team-a
          destination: {}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
  template:
    metadata:
      name: "{{repository}}"
    spec:
      project: team-a
      source:
        repoURL: "{{url}}"
        path: deploy
        targetRevision: "{{branch}}"
      destination:
        server: https://prod.example.com:6443
        namespace: "team-a-{{repository}}"
