apiVersion: cd.patrol.example/v1alpha1
kind: Application
metadata:
  name: from-file
  labels:
    origin: file
spec:
  project: default
  source:
    repoURL: https://github.com/example/apps.git
    path: base
    targetRevision: v1
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
