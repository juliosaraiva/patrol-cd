# kind cluster "patrol-control": runs the Patrol CD control plane and the e2e fixtures
# (git server, chart repository, toolbox). Create it with hack/kind/up.sh, which passes
# --kubeconfig .cache/kind/patrol-control.kubeconfig so ~/.kube/config is never touched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: patrol-control
networking:
  # Host-side API endpoint on loopback only; the port is picked by kind.
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      # Patrol UI/API: a NodePort Service on 30443 is reachable at https://localhost:8443.
      # NodePorts answer on every node, so one mapping on the control-plane node is enough.
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
      # The local registry (localhost:5001) is not mapped here: it is the patrol-registry
      # container, which publishes 127.0.0.1:5001 itself (a host port can be bound only once).
  - role: worker
# Make containerd read per-registry hosts.toml files; up.sh writes
# /etc/containerd/certs.d/localhost:5001/hosts.toml on every node so that image references
# "localhost:5001/..." are pulled from the patrol-registry container over the kind network.
# containerd 2.x (kind v0.27+ node images) accepts registry configuration only in this
# config_path form; the patch is the one in kind v0.33.0's local-registry example.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
