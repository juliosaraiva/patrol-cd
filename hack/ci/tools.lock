# Command-line tools installed on CI runners (and in Linux containers that reproduce them),
# pinned by version and SHA-256.
#
# Read by hack/ci/install-tools.sh, which hands it to hack/images/fetch-tools.sh
# (`--checksums hack/ci/tools.lock`), so the format is that of hack/images/checksums.txt. These
# are host tools for CI jobs, not files bundled in the image: the image keeps its own pins
# (Helm 4.2.1 there; CI and every recorded host run use Helm 4.3.1).
#
# Columns (whitespace separated, one file per line):
#   1 name       tool name (the --only / install-tools.sh argument)
#   2 version    pinned version (must appear in the URL); install-tools.sh also requires the
#                installed binary to report exactly this version
#   3 platform   linux/amd64 | linux/arm64 (arm64 lets a Linux container on an Apple-silicon Mac
#                exercise the installer)
#   4 sha256     SHA-256 of the downloaded file (lowercase hex)
#   5 url        HTTPS download URL (official release location)
#   6 install    comma-separated SRC:DEST:MODE; SRC is an archive member, or "." for the file
#                itself; DEST is relative to the install directory (always bin/<name> here)
#   7 sums       publisher's checksum file the sha256 was taken from and is re-checked against
#                by `hack/ci/install-tools.sh --check`, or github-asset-digest when the publisher
#                ships no checksum file (ShellCheck): the sha256 then equals the digest GitHub
#                reports for the release asset (`gh api repos/<owner>/<repo>/releases/tags/<tag>`)
#
# Recorded 2026-10-21: every file below was downloaded, hashed with `shasum -a 256` and compared
# with column 7; for GitHub release assets the GitHub asset digest matched as well. Archives are
# .tar.gz only (fetch-tools.sh extracts with tar -xzf; ShellCheck also ships .tar.xz, not used).
#
# To bump a tool: edit the version, URL, install member path (when it contains the version) and
# sha256 on both platform lines, taking the sha256 from the publisher's file in column 7 (or the
# GitHub asset digest) and re-hashing the download yourself; update the version check in
# hack/ci/install-tools.sh if the output format changed; then run
# `hack/ci/install-tools.sh --check` (downloads both platforms, verifies sums and URLs) and
# `hack/ci/install-tools.sh all` in a Linux container or on a runner.

